<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andiamo — Italy</title>
<meta name="theme-color" content="#1F5069">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Andiamo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --paper:#F3F1EB; --surface:#FFFFFF; --surface-2:#F7F5F0; --hairline:#E0DACE;
    --ink:#23201B; --muted:#736B5E; --faint:#9A9184;
    --lapis:#1F5069; --lapis-soft:#E4EDF1; --vermilion:#C1442A; --gold:#A9822F; --gold-soft:#F1E7CF; --flor:#3F7D5A; --flor-soft:#E2EFE7;
    --stage-1:#E7E3DA; --stage-2:#DCD6C9; --shadow:26,22,16;
    --serif:"Palatino Linotype",Palatino,"URW Palladio L","Iowan Old Style",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#171A1C; --surface:#1D2226; --surface-2:#22282C; --hairline:#2E353A;
      --ink:#ECE6DA; --muted:#9AA2A6; --faint:#6C757A;
      --lapis:#6FA6C0; --lapis-soft:#1E2B33; --vermilion:#E06A4E; --gold:#CBA85A; --gold-soft:#2C2A22; --flor:#7DBE9A; --flor-soft:#1D2B24;
      --stage-1:#101315; --stage-2:#0A0C0D; --shadow:0,0,0;
    }
  }
  :root[data-theme="light"]{--paper:#F3F1EB;--surface:#FFFFFF;--surface-2:#F7F5F0;--hairline:#E0DACE;--ink:#23201B;--muted:#736B5E;--faint:#9A9184;--lapis:#1F5069;--lapis-soft:#E4EDF1;--vermilion:#C1442A;--gold:#A9822F;--gold-soft:#F1E7CF; --flor:#3F7D5A; --flor-soft:#E2EFE7;--stage-1:#E7E3DA;--stage-2:#DCD6C9;--shadow:26,22,16;}
  :root[data-theme="dark"]{--paper:#171A1C;--surface:#1D2226;--surface-2:#22282C;--hairline:#2E353A;--ink:#ECE6DA;--muted:#9AA2A6;--faint:#6C757A;--lapis:#6FA6C0;--lapis-soft:#1E2B33;--vermilion:#E06A4E;--gold:#CBA85A;--gold-soft:#2C2A22; --flor:#7DBE9A; --flor-soft:#1D2B24;--stage-1:#101315;--stage-2:#0A0C0D;--shadow:0,0,0;}

  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font-family:var(--sans); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh;
    background:radial-gradient(120% 80% at 50% -10%, var(--stage-1), var(--stage-2)); background-attachment:fixed;
  }
  #app { max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh; background:var(--paper);
    box-shadow:0 0 60px -20px rgba(var(--shadow),.4); display:flex; flex-direction:column;
    padding-bottom:calc(76px + env(safe-area-inset-bottom,0px)); }
  .view { padding:22px 18px 8px; padding-top:calc(22px + env(safe-area-inset-top, 0px)); }
  .view.anim-fade { animation: aFade .22s ease both; }
  .view.anim-next { animation: aNext .28s cubic-bezier(.2,.7,.2,1) both; }
  .view.anim-prev { animation: aPrev .28s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes aFade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  @keyframes aNext { from{opacity:0;transform:translateX(28px)} to{opacity:1;transform:none} }
  @keyframes aPrev { from{opacity:0;transform:translateX(-28px)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion: reduce){ .view.anim-fade,.view.anim-next,.view.anim-prev{animation:none} }

  /* day-to-day nav (swipe / arrows / tap) */
  .daynav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 4px; }
  .daynav button { font:inherit; font-size:13.5px; font-weight:600; color:var(--lapis); background:var(--surface); border:1px solid var(--hairline); border-radius:10px; padding:9px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .daynav button:hover { border-color:var(--lapis); }
  .daynav .spacer { flex:1; }

  .eyebrow { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--lapis); font-weight:700; display:flex; gap:7px; align-items:center; margin:0; }
  .eyebrow .live { width:7px; height:7px; border-radius:50%; background:var(--vermilion); box-shadow:0 0 0 3px color-mix(in srgb, var(--vermilion) 24%, transparent); }
  h1.title { font-family:var(--serif); font-size:33px; line-height:1.03; margin:8px 0 3px; letter-spacing:-.01em; }
  .sub { font-size:15.5px; color:var(--muted); margin:0; }
  .rule { height:1px; background:var(--hairline); border:0; margin:18px 0 15px; }
  .sect-label { font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0 0 11px; }

  /* hero / countdown */
  .hero { background:linear-gradient(135deg, var(--lapis), #2C7D6E 52%, var(--gold)); border:0; border-radius:18px; padding:26px; text-align:center; margin-bottom:8px; color:#fff; box-shadow:0 16px 34px -20px rgba(var(--shadow),.7); }
  .hero .big { font-family:var(--serif); font-size:56px; line-height:1; color:#fff; margin:6px 0; font-variant-numeric:tabular-nums; text-shadow:0 2px 12px rgba(0,0,0,.18); }
  .hero .cap { font-size:15.5px; color:rgba(255,255,255,.9); margin:0; }

  /* per-day hero photo (same footprint as the countdown hero) */
  .dayhero { position:relative; border-radius:18px; overflow:hidden; height:158px; margin:12px 0 4px; background:var(--surface-2); box-shadow:0 16px 34px -20px rgba(var(--shadow),.7); }
  .dayhero img { width:100%; height:100%; object-fit:cover; display:block; }
  .dayhero .dhcap { position:absolute; left:0; right:0; bottom:0; padding:30px 16px 13px; color:#fff; font-family:var(--serif); font-size:21px; font-weight:600; text-shadow:0 1px 10px rgba(0,0,0,.55); background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,.1) 60%, transparent); }
  .dayhero .dhtag { position:absolute; top:11px; left:12px; font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#fff; background:rgba(0,0,0,.35); backdrop-filter:blur(3px); padding:5px 9px; border-radius:999px; }

  /* special-occasion banner + hearts backdrop (only on a day that has `occasion`) */
  .occasion { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 12px; margin:12px 0 4px; padding:12px 16px;
    border-radius:14px; color:#fff; font-family:var(--serif); font-size:18px; font-weight:600; letter-spacing:.01em;
    background:linear-gradient(120deg, var(--vermilion), var(--gold)); box-shadow:0 12px 28px -18px rgba(var(--shadow),.7); }
  .occ-label { display:inline-flex; align-items:center; gap:9px; }
  .occasion svg.occ-heart { width:20px; height:20px; fill:#fff; flex:none; }
  .occ-actions { display:inline-flex; align-items:center; gap:8px; }
  .occ-open, .occ-gift { flex:none; width:38px; height:38px; border-radius:50%; background:#fff; border:0; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; box-shadow:0 4px 12px -4px rgba(0,0,0,.3); text-decoration:none; }
  .occ-open svg { width:20px; height:20px; fill:var(--vermilion); }
  .occ-gift { color:var(--vermilion); }
  .occ-gift svg { width:22px; height:22px; }
  .occ-open:hover, .occ-gift:hover { transform:scale(1.06); }
  .lovenote { margin:12px 0 4px; padding:20px 20px 18px; border-radius:16px; background:var(--gold-soft);
    border:1px solid color-mix(in srgb, var(--gold) 45%, var(--hairline)); box-shadow:0 14px 30px -20px rgba(var(--shadow),.55);
    font-family:var(--serif); color:var(--ink); }
  .lovenote .ln-heart { display:block; margin:0 auto 12px; width:26px; height:26px; fill:var(--vermilion); }
  .lovenote p { margin:0 0 12px; font-size:16px; line-height:1.62; }
  .lovenote p:last-child { margin-bottom:0; }
  .noteunlock { margin:12px 0 4px; padding:18px 18px 16px; border-radius:16px; background:var(--gold-soft);
    border:1px solid color-mix(in srgb, var(--gold) 45%, var(--hairline)); text-align:center; }
  .noteunlock .nu-heart { display:block; margin:0 auto; width:24px; height:24px; fill:var(--vermilion); }
  .noteunlock .nu-t { font-family:var(--serif); font-size:16px; color:var(--ink); margin:6px 0 12px; }
  .noteunlock .nu-row { display:flex; gap:8px; justify-content:center; }
  .noteunlock .nu-in { flex:1; max-width:220px; font:inherit; font-size:15px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--hairline); background:var(--surface); color:var(--ink); }
  .noteunlock .nu-go { font:inherit; font-size:15px; font-weight:600; padding:10px 16px; border-radius:10px; border:0;
    background:var(--vermilion); color:#fff; cursor:pointer; }
  .noteunlock .nu-err { font-size:13px; color:var(--vermilion); margin:10px 0 0; }
  #app.hearts-day { position:relative; isolation:isolate; }
  #hearts { position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:.09; }
  #hearts svg { width:100%; height:100%; display:block; }
  :root[data-theme="dark"] #hearts { opacity:.17; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #hearts { opacity:.17; } }

  /* day-prep button + checklist */
  .dayhead { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .dayhead .title { margin:8px 0 3px; }
  .prepicon { position:relative; flex:none; width:44px; height:44px; border-radius:12px; background:var(--surface);
    border:1px solid var(--hairline); color:var(--gold); cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .prepicon:hover { border-color:var(--gold); }
  .prepicon svg { width:22px; height:22px; }
  .prepicon .pi-badge { position:absolute; top:-7px; right:-7px; min-width:19px; height:19px; padding:0 5px; border-radius:999px;
    background:var(--vermilion); color:#fff; font-size:11px; font-weight:800; line-height:1; display:flex; align-items:center;
    justify-content:center; box-shadow:0 2px 6px -1px rgba(var(--shadow),.5); }
  .prep-sect { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:16px 0 9px; }
  .prow { width:100%; display:flex; align-items:flex-start; gap:11px; text-align:left; background:var(--surface); border:1px solid var(--hairline);
    border-radius:11px; padding:12px 13px; margin-bottom:8px; font:inherit; color:var(--ink); cursor:pointer; }
  .prow .pcheck { flex:none; width:22px; height:22px; border-radius:6px; border:1.5px solid var(--hairline); display:flex; align-items:center;
    justify-content:center; font-size:14px; color:#fff; margin-top:1px; }
  .prow.on .pcheck { background:var(--flor); border-color:var(--flor); }
  .prow .ptxt b { display:block; font-weight:600; font-size:15px; }
  .prow .ptxt small { display:block; color:var(--muted); font-size:13px; margin-top:2px; line-height:1.4; }
  .prow.on .ptxt b { text-decoration:line-through; color:var(--muted); }

  /* up-next highlight */
  .upnext { background:color-mix(in srgb, var(--vermilion) 8%, var(--surface)); border:1px solid color-mix(in srgb, var(--vermilion) 30%, var(--hairline)); border-radius:14px; padding:16px 17px; margin-bottom:14px; width:100%; text-align:left; font:inherit; color:inherit; display:block; }
  .upnext.tap { cursor:pointer; display:grid; grid-template-columns:1fr 18px; align-items:center; gap:8px; }
  .upnext .k { font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin:0 0 5px; }
  .upnext .n { font-size:19px; font-weight:600; margin:0; }
  .upnext .t { font-family:var(--mono); font-size:14px; color:var(--muted); margin:4px 0 0; }
  .upnext .chev { color:var(--vermilion); font-size:22px; }

  /* event row */
  .ev { display:grid; grid-template-columns:58px 1fr auto; gap:13px; padding:14px 0; border-top:1px solid var(--hairline); }
  .ev:first-of-type { border-top:0; }
  .ev .ctl { display:flex; align-items:center; gap:9px; }
  .checkbtn { width:27px; height:27px; border-radius:50%; border:2px solid var(--hairline); background:var(--surface); color:transparent; font-size:15px; font-weight:800; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex:none; }
  .checkbtn.on { background:var(--lapis); border-color:var(--lapis); color:#fff; }
  .ev.done { opacity:.55; }
  .ev.done .name { text-decoration:line-through; }
  .wx { font-size:14px; color:var(--muted); background:linear-gradient(120deg, var(--lapis-soft), var(--gold-soft)); border:1px solid var(--hairline); border-radius:11px; padding:10px 13px; margin-top:12px; }
  .wx b { color:var(--ink); font-weight:700; }
  .wx .sep { color:var(--faint); margin:0 3px; }
  .ev .time { font-family:var(--mono); font-size:14.5px; color:var(--ink); font-variant-numeric:tabular-nums; padding-top:2px; font-weight:600; }
  .ev .time.flex { color:var(--faint); font-weight:400; }
  .ev .name { font-size:17.5px; font-weight:600; margin:0; line-height:1.25; }
  .ev .meta { font-size:14.5px; color:var(--muted); margin:5px 0 0; }
  .badges { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
  .badge { font-size:13px; font-weight:600; padding:5px 11px; border-radius:8px; display:inline-flex; gap:5px; align-items:center; }
  .badge.info { background:var(--lapis-soft); color:var(--lapis); }
  .badge.warn { background:color-mix(in srgb, var(--vermilion) 12%, transparent); color:var(--vermilion); }
  .badge.opt { background:var(--surface-2); color:var(--faint); border:1px solid var(--hairline); }
  .badge.book { background:var(--gold-soft); color:var(--gold); }
  .actions { display:flex; gap:9px; margin-top:11px; flex-wrap:wrap; align-items:center; }
  .tglyph { width:17px; height:17px; vertical-align:-3px; margin-right:7px; }
  .iconbtn { width:42px; height:42px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--hairline); border-radius:11px; background:var(--surface); color:var(--lapis); text-decoration:none; }
  .iconbtn:hover { border-color:var(--lapis); }
  .iconbtn:active { transform:translateY(1px); }
  .iconbtn svg { width:21px; height:21px; }
  .iconbtn.wa { color:#25844B; border-color:#25844B; }
  :root[data-theme="dark"] .iconbtn.wa, .iconbtn.wa { }
  @media (prefers-color-scheme: dark){ .iconbtn.wa { color:#4ECB7A; border-color:#4ECB7A; } }
  :root[data-theme="dark"] .iconbtn.wa { color:#4ECB7A; border-color:#4ECB7A; }
  :root[data-theme="light"] .iconbtn.wa { color:#25844B; border-color:#25844B; }
  .mapbtn-ico { width:19px; height:19px; vertical-align:-4px; margin-right:8px; }
  .act { font:inherit; font-size:14.5px; font-weight:600; text-decoration:none; color:var(--lapis); border:1px solid var(--hairline); background:var(--surface); padding:10px 15px; border-radius:9px; display:inline-flex; gap:6px; align-items:center; cursor:pointer; }
  .act:active { transform:translateY(1px); }
  .act.ticket { color:var(--gold); border-color:var(--gold); background:var(--gold-soft); }
  .badge.add { background:var(--flor-soft); color:var(--flor); }
  .mapbtn { width:100%; margin-top:12px; font:inherit; font-size:14.5px; font-weight:600; color:var(--lapis); background:var(--lapis-soft); border:1px solid var(--lapis); border-radius:12px; padding:14px; cursor:pointer; }
  .mapbtn:active { transform:translateY(1px); }
  .addbtn { width:100%; margin-top:16px; font:inherit; font-size:15px; font-weight:600; color:var(--lapis); background:var(--surface); border:1.5px dashed var(--hairline); border-radius:12px; padding:15px; cursor:pointer; }
  .addbtn:hover { border-color:var(--lapis); background:var(--lapis-soft); }
  .addform { display:flex; flex-direction:column; gap:15px; margin-top:16px; }
  .addform label { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:700; color:var(--muted); }
  .addform input, .addform select, .addform textarea { font:inherit; font-size:16px; padding:12px 13px; border:1px solid var(--hairline); border-radius:10px; background:var(--surface); color:var(--ink); }
  .addform input:focus, .addform select:focus, .addform textarea:focus { outline:2px solid var(--lapis); border-color:var(--lapis); }
  .addform textarea { resize:vertical; }
  /* rearrange rows */
  .alist { touch-action:pan-y; }
  .arow { display:grid; grid-template-columns:32px 1fr auto; gap:10px; align-items:center; padding:12px; border:1px solid var(--hairline); border-radius:11px; background:var(--surface); margin-top:9px; }
  .arow.dragging { border-color:var(--lapis); box-shadow:0 10px 22px -8px rgba(var(--shadow),.5); opacity:.97; }
  .draghandle { font-size:19px; color:var(--faint); text-align:center; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  .draghandle.locked { font-family:var(--mono); font-size:11px; cursor:default; color:var(--muted); }
  .aname { font-size:15px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .aname .tglyph { width:16px; height:16px; vertical-align:-3px; margin-right:6px; }
  .amove { font:inherit; font-size:12.5px; padding:8px 9px; border:1px solid var(--hairline); border-radius:8px; background:var(--surface-2); color:var(--ink); max-width:118px; }
  .meet { margin-top:12px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:11px; padding:13px 14px; }
  .meet .mk { font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--lapis); font-weight:700; margin:0 0 6px; }
  .meet p { font-size:14.5px; color:var(--ink); margin:0; line-height:1.5; }
  .meet .look { color:var(--muted); margin-top:6px; }
  .note { font-size:14px; color:var(--muted); margin:9px 0 0; font-style:italic; }

  /* tappable booking row — opens the pass */
  .ev.bkrow { grid-template-columns:58px 1fr auto; align-items:center; border:1px solid var(--hairline); border-left:4px solid var(--lapis); border-radius:12px; padding:14px 15px; margin:12px 0; background:var(--surface); width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; }
  .ev.bkrow:hover { border-color:var(--lapis); }
  .ev.bkrow:focus-visible { outline:2px solid var(--lapis); outline-offset:2px; }
  .ev.bkrow.t-flight { border-left-color:#40596B; }
  .ev.bkrow.t-tour { border-left-color:#566B3E; }
  .ev.bkrow.t-ticket { border-left-color:var(--gold); }
  .ev.bkrow.t-meal { border-left-color:#833E4E; }
  .ev.bkrow.t-transit { border-left-color:#564a5f; }
  .ev.bkrow .bksub { font-size:14px; color:var(--muted); margin:5px 0 0; font-family:var(--mono); }
  .ev.bkrow .chev { color:var(--faint); font-size:23px; align-self:center; justify-self:end; }

  /* day list */
  .leg-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:2px 0 3px; }
  .leg-city { font-family:var(--serif); font-size:24px; margin:0; }
  .leg-dates { font-family:var(--mono); font-size:13px; color:var(--muted); }
  .leg-hotel { font-size:14px; color:var(--muted); margin:0 0 7px; }
  .bookend { text-align:center; font-family:var(--mono); font-size:13px; letter-spacing:.03em; color:var(--faint); padding:13px 0 5px; }
  .bookend span { background:var(--surface); border:1px solid var(--hairline); padding:7px 13px; border-radius:999px; }
  .daycard { width:100%; text-align:left; background:var(--surface); border:1px solid var(--hairline); border-radius:13px; padding:15px 16px; margin-top:10px; display:grid; grid-template-columns:48px 1fr auto; gap:13px; align-items:center; cursor:pointer; font:inherit; color:inherit; }
  .daycard:hover { border-color:var(--lapis); }
  .daycard .dn { font-family:var(--serif); font-size:21px; color:var(--lapis); text-align:center; line-height:1; }
  .daycard .dn small { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--faint); text-transform:uppercase; margin-top:4px; }
  .daycard .dt { font-size:16.5px; font-weight:600; margin:0; }
  .daycard .dm { font-size:14px; color:var(--muted); margin:3px 0 0; }
  .daycard .chev { color:var(--faint); font-size:23px; }
  .dots { display:flex; gap:4px; margin-top:7px; }
  .dot { width:7px; height:7px; border-radius:50%; }

  /* booking pass (tapped from the itinerary) */
  .pass { border:1px solid var(--hairline); border-radius:16px; overflow:hidden; background:var(--surface); margin-top:6px; box-shadow:0 12px 28px -18px rgba(var(--shadow),.55); }
  .pass .band { padding:18px; color:#fff; }
  .pass .band.t-flight { background:linear-gradient(135deg,#2B3A46,#40596B); }
  .pass .band.t-tour { background:linear-gradient(135deg,#3B4A2E,#566B3E); }
  .pass .band.t-ticket { background:linear-gradient(135deg,#6E5A17,#8C7320); }
  .pass .band.t-meal { background:linear-gradient(135deg,#5A2733,#833E4E); }
  .pass .band.t-transit { background:linear-gradient(135deg,#3a3340,#564a5f); }
  .pass .pn { font-family:var(--serif); font-size:24px; margin:0; line-height:1.08; }
  .pass .pv { font-size:14px; opacity:.92; margin:6px 0 0; }
  .pass .pw { font-family:var(--mono); font-size:14px; opacity:.95; margin:10px 0 0; }
  .pass .stub { padding:16px 18px; border-top:1px dashed var(--hairline); display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .pass .stub .lbl { font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0 0 6px; }
  .pass .stub .val { font-family:var(--mono); font-size:20px; font-weight:700; color:var(--gold); margin:0; }
  .pass .stub .qty { font-size:14px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .pass .pbody { padding:16px 18px; }
  .pass .pbody > *:first-child { margin-top:0; }

  /* unlock */
  .lockbar { display:flex; gap:10px; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--hairline); border-radius:12px; padding:11px 13px; margin-top:6px; }
  .lockbar .lk { font-size:14px; color:var(--muted); }
  .lockrow button, .lockbar button { font:inherit; font-size:14px; font-weight:600; border:1px solid var(--lapis); color:var(--lapis); background:none; border-radius:9px; padding:10px 15px; cursor:pointer; white-space:nowrap; }
  .lockrow { display:flex; gap:8px; margin-top:9px; }
  .lockrow input { flex:1; min-width:0; font:inherit; font-size:16px; padding:11px 13px; border:1px solid var(--hairline); border-radius:9px; background:var(--surface); color:var(--ink); }
  .lockrow input:focus { outline:2px solid var(--lapis); outline-offset:0; border-color:var(--lapis); }
  .lockhint { font-size:13px; color:var(--faint); margin:9px 0 0; }
  .lockerr { font-size:13.5px; color:var(--vermilion); font-weight:600; margin:9px 0 0; }

  /* trips tab — one poster-style card per trip */
  .tripcard { position:relative; display:block; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
    background:var(--surface); border:1px solid var(--hairline); border-radius:16px; overflow:hidden; margin-top:14px;
    box-shadow:0 14px 30px -22px rgba(var(--shadow),.55); transition:border-color .15s, transform .15s; }
  .tripcard:hover { border-color:var(--lapis); }
  .tripcard:active { transform:scale(.995); }
  .tripcard .tc-img { height:150px; background:var(--surface-2); }
  .tripcard .tc-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .tripcard .tc-body { padding:14px 16px 16px; }
  .tripcard .tc-when { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--lapis); font-weight:700; margin:0; }
  .tripcard .tc-name { font-family:var(--serif); font-size:25px; line-height:1.05; margin:5px 0 2px; }
  .tripcard .tc-sub { font-size:15px; color:var(--muted); margin:0; }
  .tripcard .tc-meta { font-family:var(--mono); font-size:12.5px; color:var(--faint); margin:10px 0 0; }
  .tripcard .tc-chev { position:absolute; right:14px; bottom:12px; color:var(--faint); font-size:24px; line-height:1; }

  /* trip tab */
  .card { background:var(--surface); border:1px solid var(--hairline); border-radius:13px; padding:16px; margin-top:13px; }
  .card h3 { font-size:16px; margin:0 0 9px; }
  .card p { font-size:14.5px; color:var(--muted); margin:5px 0; }
  .card p b { color:var(--ink); }
  ul.plain { margin:7px 0 0; padding-left:19px; }
  ul.plain li { font-size:14.5px; color:var(--muted); margin:6px 0; }

  .backbtn { background:none; border:0; color:var(--lapis); font:inherit; font-size:15px; font-weight:600; padding:0 0 10px; cursor:pointer; display:inline-flex; gap:5px; align-items:center; }

  /* tab bar */
  .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
    display:grid; grid-template-columns:repeat(2,1fr); background:var(--surface); border-top:1px solid var(--hairline);
    padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px)); z-index:20; }
  .tab { border:0; background:none; font:inherit; cursor:pointer; text-align:center; font-size:11.5px; font-weight:600; color:var(--faint); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .tab.on { color:var(--lapis); }
  .tab svg { width:23px; height:23px; }
  .foot-note { text-align:center; font-size:12.5px; color:var(--faint); padding:18px; }
</style>

<body>
<div id="app"><div class="view" id="view"></div></div>
<nav class="tabbar" id="tabbar"></nav>

<script src="trip-data.js"></script>
<script>
(function(){
  "use strict";
  const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
  const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const params = new URLSearchParams(location.search);

  // ---- the trip collection ----
  // TRIPS (from trip-data.js) holds every trip; TRIP is the one being viewed.
  // Picking a trip on the Trips tab sets TRIP; every other view reads from it.
  let TRIP = TRIPS[0];
  (function restoreActiveTrip(){
    try { const id = localStorage.getItem('andiamo-trip'); if (id){ const t = TRIPS.find(x=>x.id===id); if (t) TRIP = t; } } catch(e){}
  })();
  function selectTrip(id){
    const t = TRIPS.find(x=>x.id===id); if (!t) return;
    TRIP = t;
    try { localStorage.setItem('andiamo-trip', id); } catch(e){}
  }

  // ---- confirmation-code unlock (client-side AES-GCM) ----
  let CODES = null, PASS = null;
  try { const s = sessionStorage.getItem('andiamo-codes'); if (s) CODES = JSON.parse(s); } catch(e){}
  try { PASS = sessionStorage.getItem('andiamo-pass'); } catch(e){}
  const b64d = (s) => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

  // decrypt an encrypted ticket PDF (tickets/<key>.enc = [16 salt][12 iv][ciphertext]).
  // `win` is a tab opened synchronously on tap (so iOS doesn't block it); we point it at the PDF.
  async function openTicket(key, win){
    if (!PASS) throw new Error('locked');
    const r = await fetch('tickets/'+key+'.enc', {cache:'no-store'});
    if (!r.ok) throw new Error('missing');
    const buf = new Uint8Array(await r.arrayBuffer());
    const salt = buf.slice(0,16), iv = buf.slice(16,28), ct = buf.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(PASS), 'PBKDF2', false, ['deriveKey']);
    const dk = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, dk, ct);
    const url = URL.createObjectURL(new Blob([pt], {type:'application/pdf'}));
    if (win && !win.closed) { win.location.href = url; }             // use the pre-opened tab
    else {                                                            // fallback if it was blocked
      const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
    setTimeout(()=>URL.revokeObjectURL(url), 120000);
  }
  async function decryptSecrets(pass){
    const s = window.SECRETS; if(!s) throw new Error('no secrets');
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(s.salt), iterations:s.iter, hash:s.hash}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(s.iv)}, key, b64d(s.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  // the anniversary note has its OWN passkey and its own file (note.js -> window.LOVENOTE),
  // separate from the family confirmation-code passphrase. Simple by design: the note is XOR-encoded
  // with the passkey and base64'd (the passkey is never stored), with a marker so a wrong word is caught.
  // Not hashed and not strong; it does not need to be.
  let NOTE = null;
  try { NOTE = sessionStorage.getItem('andiamo-lovenote') || null; } catch(e){}
  function decodeNote(pass){
    const s = window.LOVENOTE; if (!s || !pass) return null;
    let data; try { data = b64d(s); } catch(e){ return null; }
    const key = new TextEncoder().encode(pass.toLowerCase());   // case-insensitive passkey
    const out = new Uint8Array(data.length);
    for (let i=0;i<data.length;i++) out[i] = data[i] ^ key[i % key.length];
    const mark = new TextEncoder().encode('LOVE');
    for (let i=0;i<mark.length;i++) if (out[i] !== mark[i]) return null;   // wrong word
    return new TextDecoder().decode(out.slice(mark.length));
  }
  const codeFor = (e) => (e && e.codeKey && CODES && CODES[e.codeKey]) ? CODES[e.codeKey] : null;
  const bookVal = (e) => codeFor(e) || (e.booking ? e.booking.value : '');
  const bookLabel = (e) => codeFor(e) ? 'Confirmation' : (e.booking ? e.booking.label : '');

  // ---- check off places (saved on this device) ----
  let DONE = {};
  try { DONE = JSON.parse(localStorage.getItem('andiamo-done') || '{}') || {}; } catch(e){}
  // Check-offs are namespaced by trip so the same-indexed stop in two trips
  // doesn't share a checkmark. (One-time migration of the pre-namespace keys,
  // which all belonged to the original Rome & Florence trip.)
  (function migrateDone(){
    let changed = false;
    for (const k of Object.keys(DONE)){
      if (k.indexOf(':') === -1){ DONE['rome-florence-2026:'+k] = DONE[k]; delete DONE[k]; changed = true; }
    }
    if (changed) try { localStorage.setItem('andiamo-done', JSON.stringify(DONE)); } catch(e){}
  })();
  const doneKey = (e) => (TRIP.id || 'trip') + ':' + e._id;
  const isDone = (key) => !!DONE[key];
  function toggleDone(key){
    if (DONE[key]) delete DONE[key]; else DONE[key] = 1;
    try { localStorage.setItem('andiamo-done', JSON.stringify(DONE)); } catch(e){}
  }
  function checkButton(idx){
    const b = $('<button class="checkbtn'+(isDone(idx)?' on':'')+'" aria-label="Mark as done">✓</button>');
    b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      toggleDone(idx);
      const on = isDone(idx);
      b.classList.toggle('on', on);          // update in place — no re-render, no scroll jump
      const row = b.closest('.ev');
      if (row) row.classList.toggle('done', on);
    });
    return b;
  }

  // per-day prep checklist — remembers what you've ticked off
  let PREP = {};
  try { PREP = JSON.parse(localStorage.getItem('andiamo-prep') || '{}') || {}; } catch(e){}
  const prepKey  = (iso, txt) => iso + '|' + txt;
  const prepDone = (iso, txt) => !!PREP[prepKey(iso, txt)];
  function togglePrep(iso, txt){
    const k = prepKey(iso, txt);
    if (PREP[k]) delete PREP[k]; else PREP[k] = 1;
    try { localStorage.setItem('andiamo-prep', JSON.stringify(PREP)); } catch(e){}
  }

  // ---- custom items (added via "Send to trip" -> GitHub issue -> Action -> custom.json) ----
  TRIPS.forEach(t => t.events.forEach((e,i)=>{ e._id = String(i); }));   // stable id per trip (keeps check-off keys)
  let CUSTOM = [];
  (function loadLocalCustom(){
    try { const a = JSON.parse(localStorage.getItem('andiamo-custom')||'[]'); if (Array.isArray(a)) CUSTOM = a; } catch(e){}
    CUSTOM.forEach(e=>{ e._id = e.id; });
  })();
  const allEvents = () => TRIP.events.concat(CUSTOM);
  async function loadRemoteCustom(){
    try {
      const r = await fetch('custom.json?_='+Date.now(), {cache:'no-store'});
      if (!r.ok) return; const arr = await r.json(); if (!Array.isArray(arr)) return;
      arr.forEach(e=>{ e._id = e.id; });
      CUSTOM = arr;
      try { localStorage.setItem('andiamo-custom', JSON.stringify(arr)); } catch(e){}
      bgRender();
    } catch(e){}
  }
  const GH_REPO = 'towbinaj/Andiamo';   // where "Send to trip" opens an issue

  // ---- shared arrangement: moves between days + order within a day (overrides.json) ----
  const normOver = (o) => ({ moves: (o&&o.moves)||{}, order: (o&&o.order)||{} });
  let OVER = normOver(null), OVER_DIRTY = false;
  try { const a = JSON.parse(localStorage.getItem('andiamo-over')||'null'); if (a) OVER = normOver(a); } catch(e){}
  try { OVER_DIRTY = localStorage.getItem('andiamo-over-dirty')==='1'; } catch(e){}
  const effDate = (e) => OVER.moves[e._id] || e.date;
  function saveOver(dirty){
    try { localStorage.setItem('andiamo-over', JSON.stringify(OVER)); if (dirty){ OVER_DIRTY = true; localStorage.setItem('andiamo-over-dirty','1'); } } catch(e){}
  }
  const canon = (o) => { const s = (x) => (x && typeof x==='object' && !Array.isArray(x)) ? '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+s(x[k])).join(',')+'}' : JSON.stringify(x); return s(o); };
  async function loadRemoteOver(){
    try {
      const r = await fetch('overrides.json?_='+Date.now(), {cache:'no-store'}); if (!r.ok) return;
      const o = normOver(await r.json());
      if (OVER_DIRTY){
        // keep our local edits until they land; once the remote matches, we're published & clean
        if (canon(o) === canon(OVER)){ OVER_DIRTY = false; try { localStorage.removeItem('andiamo-over-dirty'); } catch(e){} }
        return;
      }
      OVER = o; try { localStorage.setItem('andiamo-over', JSON.stringify(OVER)); } catch(e){} bgRender();
    } catch(e){}
  }
  // order a day's flexible items by the saved arrangement (unknown ids keep their natural order, appended)
  function applyOrder(iso, list){
    const ord = OVER.order[iso]; if (!ord || !ord.length) return list;
    const pos = {}; ord.forEach((id,i)=> pos[id]=i);
    return list.slice().sort((a,b)=>{
      const pa = pos[a._id]!=null ? pos[a._id] : 900+list.indexOf(a);
      const pb = pos[b._id]!=null ? pos[b._id] : 900+list.indexOf(b);
      return pa - pb;
    });
  }

  // ---- weather + sunrise/sunset (Open-Meteo, no key; cached for offline) ----
  const CITY_COORD = { Rome:{lat:41.9028,lon:12.4964}, Florence:{lat:43.7696,lon:11.2558} };
  let WX = null;
  try { WX = JSON.parse(localStorage.getItem('andiamo-wx') || 'null'); } catch(e){}
  async function fetchWeather(){
    const city = {};
    for (const name of Object.keys(CITY_COORD)){
      const c = CITY_COORD[name];
      const url = 'https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lon+
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Europe%2FRome&temperature_unit=fahrenheit&start_date='+TRIP.startDate+'&end_date='+TRIP.endDate;
      const r = await fetch(url); if(!r.ok) throw new Error('wx'); const j = await r.json();
      const days = {};
      (j.daily.time||[]).forEach((d,i)=>{ days[d] = { code:j.daily.weather_code[i], hi:Math.round(j.daily.temperature_2m_max[i]), lo:Math.round(j.daily.temperature_2m_min[i]), sr:j.daily.sunrise[i], ss:j.daily.sunset[i] }; });
      city[name] = days;
    }
    WX = { at: new Date().toISOString(), city };
    try { localStorage.setItem('andiamo-wx', JSON.stringify(WX)); } catch(e){}
  }
  const wxFor = (iso) => { if(!WX||!WX.city) return null; const c = WX.city[cityForDate(iso)]; return (c && c[iso]) || null; };
  function wxDesc(code){
    const m = {0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌦️','Drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],80:['🌦️','Showers'],81:['🌦️','Showers'],82:['⛈️','Heavy showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Storm'],99:['⛈️','Storm']};
    return m[code] || ['🌡️',''];
  }
  const clock = (dt) => { if(!dt) return ''; const t=String(dt).split('T')[1]; return t ? fmtTime(t.slice(0,5)) : ''; };
  function weatherChip(iso){
    const w = wxFor(iso); if(!w) return null;
    const d = wxDesc(w.code);
    return $('<div class="wx">'+d[0]+' <b>'+w.hi+'°</b> / '+w.lo+'°F · '+esc(d[1])+
      '<span class="sep">·</span>☀ '+clock(w.sr)+'<span class="sep">·</span>🌙 '+clock(w.ss)+'</div>');
  }

  // per-day hero photo of the day's highlight
  function dayHero(iso){
    const d = TRIP.days.find(x=>x.date===iso);
    if (!d || !d.photo) return null;
    const node = $('<div class="dayhero"><img loading="lazy" decoding="async" src="'+esc(d.photo)+'" alt="'+esc(d.highlight||'')+'">'+
      '<span class="dhtag">Highlight</span>'+
      (d.highlight ? '<div class="dhcap">'+esc(d.highlight)+'</div>' : '')+'</div>');
    // if the photo file isn't there (yet), drop the hero rather than show a broken image
    node.querySelector('img').addEventListener('error', ()=>{ node.remove(); });
    return node;
  }

  // ---- special occasion (e.g. an anniversary): a HIDDEN banner + hearts backdrop ----
  // It stays hidden until the *real* device date's month-day matches the occasion day's
  // (so it surfaces on Aug 5 in real life, every year — not merely when you browse that itinerary day).
  const HEART = 'M12 21s-6.5-4.35-9-8.5C1.5 9.5 3 6 6.5 6c2 0 3 1.2 3.5 2 .5-.8 1.5-2 3.5-2C20 6 22.5 9.5 21 12.5 18.5 16.65 12 21 12 21Z';
  const occasionOf = (iso) => { const d=TRIP.days.find(x=>x.date===iso); return d && d.occasion ? d.occasion : ''; };
  const giftOf = (iso) => { const d=TRIP.days.find(x=>x.date===iso); return d && d.gift ? d.gift : ''; };
  const revealedOccasion = (iso) => { const occ = occasionOf(iso); return (occ && todayISO().slice(5) === iso.slice(5)) ? occ : ''; };
  let notePromptOpen = false;   // set once the banner's "Open your note" button is tapped
  function occasionBanner(iso){
    const occ = revealedOccasion(iso); if(!occ) return null;
    const b = $('<div class="occasion"><span class="occ-label"><svg class="occ-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="'+HEART+'"/></svg><span>'+esc(occ)+'</span></span></div>');
    const acts = $('<span class="occ-actions"></span>');
    if (window.LOVENOTE && !NOTE && !notePromptOpen){
      const btn = $('<button class="occ-open" aria-label="Open your note" title="Open your note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+HEART+'"/></svg></button>');
      btn.addEventListener('click', ()=>{ notePromptOpen = true; render(); });
      acts.appendChild(btn);
    }
    const gurl = giftOf(iso);
    if (gurl){
      if (NOTE){   // unlocked: the gift is a live link to the photos
        acts.appendChild($('<a class="occ-gift" href="'+esc(gurl)+'" target="_blank" rel="noopener" aria-label="Your gift" title="Your gift">'+svgIcon('gift')+'</a>'));
      } else {     // locked: tapping asks for the same passkey as the note
        const gb = $('<button class="occ-gift" aria-label="Your gift" title="Your gift">'+svgIcon('gift')+'</button>');
        gb.addEventListener('click', ()=>{ notePromptOpen = true; render(); });
        acts.appendChild(gb);
      }
    }
    if (acts.children.length) b.appendChild(acts);
    return b;
  }
  // a private note on the occasion day. It has its own passkey (separate from the codes):
  // locked, it shows a small "enter the word" prompt; unlocked, the note itself.
  const heartSVG = (cls) => '<svg class="'+cls+'" viewBox="0 0 24 24" aria-hidden="true"><path d="'+HEART+'"/></svg>';
  function noteCard(text){
    const raw = String(text).replace(/\\n/g,'\n').trim();   // accept real or literal "\n" line breaks
    const paras = raw.split(/\n\s*\n/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');
    return $('<div class="lovenote">'+heartSVG('ln-heart')+paras+'</div>');
  }
  function occasionReveal(iso){
    if (!revealedOccasion(iso)) return null;          // same gate as the banner (the actual day)
    if (NOTE) return noteCard(NOTE);                  // already unlocked this session
    if (!window.LOVENOTE || !notePromptOpen) return null;   // wait for the banner button
    const box = $('<div class="noteunlock">'+
      '<div class="nu-row"><input type="text" class="nu-in" placeholder="Enter the word" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="nu-go">Reveal</button></div>'+
      '<p class="nu-err" hidden>That is not the word. Try again.</p></div>');
    const input = box.querySelector('.nu-in'), err = box.querySelector('.nu-err');
    const attempt = ()=>{
      const txt = decodeNote(input.value.trim());
      if (txt == null){ err.hidden = false; input.value=''; input.focus(); return; }
      NOTE = txt; try { sessionStorage.setItem('andiamo-lovenote', txt); } catch(e){}
      render();
    };
    box.querySelector('.nu-go').addEventListener('click', attempt);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attempt(); });
    setTimeout(()=>{ try { input.focus(); } catch(e){} }, 0);
    return box;
  }
  // a full-bleed layer of faint hearts, painted behind the day's content (z-index:-1 inside #app)
  function setOccasionBg(iso){
    const app = document.getElementById('app');
    const on = !!revealedOccasion(iso);
    app.classList.toggle('hearts-day', on);
    const existing = document.getElementById('hearts');
    if (!on){ if (existing) existing.remove(); return; }
    if (existing) return;
    const layer = document.createElement('div'); layer.id = 'hearts';
    layer.innerHTML =
      '<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">'+
        '<pattern id="hp" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">'+
          '<path fill="#C1442A" transform="translate(6 7) scale(.7)" d="'+HEART+'"/>'+
          '<path fill="#C1442A" transform="translate(40 40) scale(.95)" d="'+HEART+'"/>'+
        '</pattern>'+
        '<rect width="100%" height="100%" fill="url(#hp)"/>'+

  }

  // ---- date helpers ----
  const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const asDate = (iso) => new Date(iso+'T12:00:00');
  const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const daysBetween = (a,b) => Math.round((asDate(b)-asDate(a))/86400000);
  const dow = (iso) => WD[asDate(iso).getDay()];
  const fmtDate = (iso) => { const d=asDate(iso); return WD[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate(); };
  const fmtTime = (hm) => { if(!hm) return null; let [h,m]=hm.split(':').map(Number); const ap=h<12?'AM':'PM'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; };

  const cityForDate = (iso) => { let c=TRIP.legs[0].city; for(const l of TRIP.legs){ if(iso>=l.start) c=l.city; } return c; };
  const dayTitle = (iso) => { const d=TRIP.days.find(x=>x.date===iso); return d?d.title:''; };
  const dayIndex = (iso) => TRIP.days.findIndex(x=>x.date===iso);
  const eventsOn = (iso) => allEvents().filter(e=>effDate(e)===iso);
  const locOf = (e) => e.address || (e.meet && e.meet.address) || '';   // a real street location, if any
  // lead the map query with the place NAME so the pin is labelled (not just an address that can geocode to a bank)
  const mapURL = (e) => 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.title + ', ' + (locOf(e) || cityForDate(e.date)));
  // the hotel/leg an event falls under, and walking directions from that hotel to the event
  const legForDate = (iso) => { let leg=TRIP.legs[0]; for(const l of TRIP.legs){ if(iso>=l.start) leg=l; } return leg; };
  const hotelDirURL = (leg, e) => 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(leg.hotelAddress)+'&destination='+encodeURIComponent(e.title+', '+locOf(e))+'&travelmode=walking';

  const sortFixed = (a,b) => (a.start||'').localeCompare(b.start||'');

  const badgeCls = (h) => /👕/.test(h) ? 'info' : (/ID|passport|backpack|steps|early|sharp|Firenze|Check in/i.test(h) ? 'warn' : 'info');

  // colorful glyph per event type, and city-based accent colour (Rome=blue, Florence=green)
  // ---- inline line-icons (classier than emoji) ----
  const ICONS = {

    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>',
    phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7 12.8 12.8 0 0 0 .7 2.8 2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9z"/>',
    chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>'

  const svgIcon = (name, cls, color) =>
    '<svg class="'+(cls||'')+'"'+(color?' style="color:'+color+'"':'')+' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||'')+'</svg>';
  const TYPE_ICON  = { flight:'plane', transit:'train', tour:'flag', ticket:'ticket', meal:'utensils', treat:'cone', cafe:'coffee' };
  const TYPE_COLOR = { flight:'#4E6A82', transit:'#6E63C6', tour:'#4E7C57', ticket:'#B08A3E', meal:'#B45B3E', treat:'#C0678B', cafe:'#8A6D3B' };
  const typeIcon = (e) => TYPE_ICON[e.type] ? svgIcon(TYPE_ICON[e.type], 'tglyph', TYPE_COLOR[e.type]) : '';
  const withGlyph = (e) => typeIcon(e) + esc(e.title);
  const iconBtn = (href, label, icon, cls) =>
    '<a class="iconbtn'+(cls?' '+cls:'')+'" target="_blank" rel="noopener" href="'+href+'" title="'+esc(label)+'" aria-label="'+esc(label)+'">'+svgIcon(icon)+'</a>';
  const cityAccent = (iso) => cityForDate(iso)==='Florence' ? 'var(--flor)' : 'var(--lapis)';

  // Wikipedia article per key attraction (title -> article slug)
  const WIKI = {
    "Trevi Fountain":"Trevi_Fountain", "Spanish Steps":"Spanish_Steps",
    "Villa Borghese":"Villa_Borghese_gardens", "Pincio Terrace":"Pincio",
    "Piazza del Popolo":"Piazza_del_Popolo", "Pantheon":"Pantheon,_Rome",

    "Church of St. Ignatius":"Church_of_St._Ignatius_of_Loyola,_Rome", "Ara Pacis":"Ara_Pacis",
    "Capitoline Museums":"Capitoline_Museums", "Vittoriano (Altare della Patria)":"Victor_Emmanuel_II_National_Monument",

    "Domus Aurea":"Domus_Aurea", "Santo Spirito":"Santo_Spirito,_Florence",
    "Brancacci Chapel":"Brancacci_Chapel", "Museo di San Marco":"San_Marco,_Florence"
  };
  const wikiURL = (e) => WIKI[e.title] ? 'https://en.wikipedia.org/wiki/'+WIKI[e.title] : null;

  // Rick Steves free audio tours (linked to his official files — not re-hosted)
  const RS = 'https://podcasts.ricksteves.com/audio-tours/';
  const AUDIO = {
    "Trevi Fountain": RS+"rome-heart.mp3", "Spanish Steps": RS+"rome-heart.mp3",
    "Pantheon": RS+"rome-pantheon.mp3", "Piazza Navona / Campo de' Fiori": RS+"rome-heart.mp3",
    "St. Peter's Basilica": RS+"rome-st-peters-basilica.mp3", "Vatican Museums": RS+"rome-vatican-museums.mp3",
    "Sistine Chapel": RS+"rome-sistine-chapel.mp3",
    "Colosseum — Arena Floor, Forum & Palatine": RS+"rome-colosseum.mp3",
    "Duomo (Cathedral)": RS+"florence-renaissance-walk.mp3", "Piazza della Signoria": RS+"florence-renaissance-walk.mp3",
    "Ponte Vecchio": RS+"florence-renaissance-walk.mp3", "Uffizi Gallery": RS+"florence-uffizi-gallery.mp3",
    "Galleria dell'Accademia": RS+"florence-accademia-david.mp3", "Bargello": RS+"florence-bargello.mp3"
  };
  const audioURL = (e) => AUDIO[e.title] || null;

  // Rick Steves tour route maps (linked to his official PDFs — not re-hosted)
  const RSMAP = 'https://www.ricksteves.com/watch-read-listen/audio/audio-tours/';
  const MAPS = {
    "Trevi Fountain": RSMAP+"heart-of-rome-walk-map-1.pdf", "Spanish Steps": RSMAP+"heart-of-rome-walk-map-1.pdf",
    "Pantheon": RSMAP+"map-audiotours-rome-pantheon.pdf", "Piazza Navona / Campo de' Fiori": RSMAP+"heart-of-rome-walk-map-1.pdf",
    "St. Peter's Basilica": RSMAP+"map-audiotours-st-peters-basilica.pdf", "Vatican Museums": RSMAP+"vatican-musems-map.pdf",
    "Sistine Chapel": RSMAP+"map-audiotours-rome-sistine.pdf",
    "Colosseum — Arena Floor, Forum & Palatine": "https://d2zwvgyp7l6t28.cloudfront.net/Projects/cms/production/000/027/281/slideshow/17a96174c12bcc997088a15a365f57dc/map-audiotours-colosseum.pdf",
    "Duomo (Cathedral)": RSMAP+"map-audiotours-florence-renaissance-walk.pdf", "Piazza della Signoria": RSMAP+"map-audiotours-florence-renaissance-walk.pdf",
    "Ponte Vecchio": RSMAP+"map-audiotours-florence-renaissance-walk.pdf", "Uffizi Gallery": RSMAP+"map-audiotours-florence-uffizi.pdf",
    "Galleria dell'Accademia": RSMAP+"map-audiotours-accademia.pdf", "Bargello": RSMAP+"map-audiotours-florence-bargello-museum.pdf"
  };
  const tourMapURL = (e) => MAPS[e.title] || null;

  const dirURL = (pts) => {   // one Google Maps walking-directions URL through the given labelled stops
    const enc = encodeURIComponent;
    let u = 'https://www.google.com/maps/dir/?api=1&origin='+enc(pts[0])+'&destination='+enc(pts[pts.length-1])+'&travelmode=walking';
    const mid = pts.slice(1,-1); if (mid.length) u += '&waypoints='+mid.map(enc).join('|');
    return u;
  };
  // Walking route(s) through a day's stops. Long days are split into parts (overlapping by
  // one stop so they connect) rather than dropped, since Google Maps URLs choke past ~10 stops.
  function dayMapURLs(iso){
    const isPlace = (e) => e.type!=='flight' && e.type!=='transit' && !/^(check in|depart|return to)/i.test(e.title) && locOf(e);
    const evs = eventsOn(iso).filter(isPlace);
    // order: timed sights/tickets first (by time), then daytime flexible stops, then dinners LAST
    const timed = evs.filter(e=>e.fixed&&e.start&&e.type!=='meal').sort(sortFixed);
    const flex  = evs.filter(e=>!(e.fixed&&e.start));
    const meals = evs.filter(e=>e.type==='meal'&&e.fixed&&e.start).sort(sortFixed);
    const pts = timed.concat(flex, meals).map(e => e.title + ', ' + locOf(e));
    if (pts.length < 2) return [];
    const MAX = 10, parts = [];
    if (pts.length <= MAX) parts.push(pts);
    else for (let i=0; i<pts.length-1; i += MAX-1) parts.push(pts.slice(i, i+MAX));
    return parts.map(dirURL);
  }

  // ---- render one event ----
  // A booked event becomes a tappable row that opens its pass (see viewBooking).
  function renderEvent(e){
    const t = e.start ? fmtTime(e.start) : '•';
    const id = e._id;
    const dkey = doneKey(e);
    const done = isDone(dkey) ? ' done' : '';

    if (e.booking){
      const sub = esc(bookVal(e)) + (e.booking.source ? ' · ' + esc(e.booking.source) : '');
      const node = $(
        '<div class="ev bkrow t-'+e.type+done+'" role="button" tabindex="0">'+
          '<div class="time'+(e.start?'':' flex')+'">'+esc(t)+'</div>'+
          '<div class="body"><p class="name">'+withGlyph(e)+'</p><p class="bksub">'+sub+'</p></div>'+
          '<div class="ctl"><span class="chev">›</span></div>'+
        '</div>'
      );
      node.querySelector('.ctl').insertBefore(checkButton(dkey), node.querySelector('.chev'));
      const open = ()=>{ location.hash = '#booking/'+id; };
      node.addEventListener('click', open);
      node.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); open(); } });
      return node;
    }

    const badges = [];
    if (e.optional) badges.push('<span class="badge opt">optional</span>');
    if (e.custom) badges.push('<span class="badge add">added</span>');
    (e.headsup||[]).forEach(h=> badges.push('<span class="badge '+badgeCls(h)+'">'+esc(h)+'</span>'));

    const actions = [];
    if (locOf(e))
      actions.push(iconBtn(mapURL(e), 'Directions', 'pin'));
    if (wikiURL(e)) actions.push(iconBtn(wikiURL(e), 'Read on Wikipedia', 'book'));
    if (audioURL(e)) actions.push(iconBtn(audioURL(e), 'Rick Steves audio tour', 'headphones'));
    if (tourMapURL(e)) actions.push(iconBtn(tourMapURL(e), 'Rick Steves tour map (PDF)', 'map'));
    if (e.website) actions.push(iconBtn(e.website, 'Website', 'globe'));
    if (e.phone) actions.push(iconBtn('tel:'+e.phone.replace(/[^+\d]/g,''), 'Call', 'phone'));
    if (e.whatsapp) actions.push(iconBtn('https://wa.me/'+e.whatsapp.replace(/[^\d]/g,''), 'WhatsApp', 'chat', 'wa'));

    const node = $(
      '<div class="ev'+done+'">'+
        '<div class="time'+(e.start?'':' flex')+'">'+esc(t)+'</div>'+
        '<div class="body">'+
          '<p class="name">'+withGlyph(e)+'</p>'+
          (badges.length?'<div class="badges">'+badges.join('')+'</div>':'')+
          (e.note?'<p class="note">'+esc(e.note)+'</p>':'')+
          (actions.length?'<div class="actions">'+actions.join('')+'</div>':'')+
        '</div>'+
        '<div class="ctl"></div>'+
      '</div>'
    );
    node.querySelector('.ctl').appendChild(checkButton(dkey));
    return node;
  }

  // ---- render a full day's events into a container ----
  function renderDay(iso, host){
    const evs = eventsOn(iso);
    const fixed = evs.filter(e=>e.fixed && e.start).sort(sortFixed);
    const flex  = applyOrder(iso, evs.filter(e=>!(e.fixed && e.start)));
    if (fixed.length){
      host.appendChild($('<p class="sect-label">Scheduled</p>'));
      fixed.forEach(e=>host.appendChild(renderEvent(e)));
    }
    if (flex.length){
      if (fixed.length) host.appendChild($('<hr class="rule">'));
      host.appendChild($('<p class="sect-label">Flexible · any order</p>'));
      flex.forEach(e=>host.appendChild(renderEvent(e)));
    }
  }

  // ---- DAYS ----
  function viewDays(host){
    host.appendChild($('<p class="eyebrow">The whole trip</p>'));
    host.appendChild($('<h1 class="title">Days</h1>'));
    host.appendChild($('<p class="sub">'+fmtDate(TRIP.startDate)+' – '+fmtDate(TRIP.endDate)+' · '+TRIP.legs.length+' cities</p>'));

    // countdown while the trip is still ahead
    const today = todayISO();
    if (today < TRIP.startDate){
      const n = daysBetween(today, TRIP.startDate);
      const city = (TRIP.legs && TRIP.legs[0]) ? TRIP.legs[0].city : '';
      host.appendChild($('<div class="hero"><p class="cap">Trip begins in</p><p class="big">'+n+'</p><p class="cap">'+(n===1?'day':'days')+(city?' — see you in '+esc(city)+' ✈':' ✈')+'</p></div>'));
    }

    host.appendChild($('<hr class="rule">'));

    // arrival bookend
    const arr = TRIP.events.find(e=>e.type==='flight' && e.date===TRIP.startDate);
    if (arr) host.appendChild($('<div class="bookend"><span>✈ '+esc(arr.title)+' · '+fmtDate(arr.date)+' · '+esc(fmtTime(arr.start))+'</span></div>'));

    TRIP.legs.forEach((leg, li)=>{
      const accent = leg.city==='Florence' ? 'var(--flor)' : 'var(--lapis)';
      host.appendChild($('<div style="margin-top:14px"><div class="leg-head"><h3 class="leg-city" style="color:'+accent+'">'+esc(leg.city)+'</h3><span class="leg-dates">'+MO[asDate(leg.start).getMonth()]+' '+asDate(leg.start).getDate()+'–'+asDate(leg.end).getDate()+'</span></div><p class="leg-hotel">🏨 '+esc(leg.hotelName)+'</p></div>'));
      TRIP.days.filter(d=> d.date>=leg.start && d.date<(li<TRIP.legs.length-1?TRIP.legs[li+1].start:'9999') ).forEach(d=>{
        const evs = eventsOn(d.date);
        const hasBook = evs.some(e=>e.booking);
        const hasFixed = evs.some(e=>e.fixed && e.start && e.type!=='meal');
        const summary = evs.filter(e=>e.fixed && e.start).sort(sortFixed).map(e=>e.title.split(' — ')[0].split(' (')[0]).slice(0,3).join(' · ') || 'Open day';
        const dots = (hasFixed?'<span class="dot" style="background:'+accent+'"></span>':'')+(hasBook?'<span class="dot" style="background:var(--gold)"></span>':'');
        const card = $('<button class="daycard" style="border-left:4px solid '+accent+'"><div class="dn" style="color:'+accent+'">'+(dayIndex(d.date)+1)+'<small>'+dow(d.date)+'</small></div><div><p class="dt">'+esc(d.title)+'</p><p class="dm">'+esc(summary)+'</p><div class="dots">'+dots+'</div></div><div class="chev">›</div></button>');
        card.addEventListener('click', ()=>{ location.hash='#day/'+d.date; });
        host.appendChild(card);
      });
    });

    const dep = TRIP.events.find(e=>e.type==='flight' && e.date===TRIP.endDate);
    if (dep) host.appendChild($('<div class="bookend"><span>✈ '+esc(dep.title)+' · '+fmtDate(dep.date)+' · '+esc(fmtTime(dep.start))+'</span></div>'));

    // confirmation codes for this trip's bookings (only if an encrypted set is present)
    if (window.SECRETS){
      host.appendChild($('<hr class="rule">'));
      host.appendChild($('<p class="sect-label">Confirmation codes</p>'));
      renderLock(host);
    }
  }

  // ---- single DAY detail ----
  function viewDayDetail(host, iso){
    const back = $('<button class="backbtn">‹ Days</button>');
    back.addEventListener('click', ()=>{ location.hash='#days'; });
    host.appendChild(back);

    // prev / next day (also swipe & arrow keys)
    const i = dayIndex(iso);
    const nav = $('<div class="daynav"></div>');
    if (i>0){ const b=$('<button>‹ '+fmtDate(TRIP.days[i-1].date)+'</button>'); b.addEventListener('click', ()=>goDay(-1)); nav.appendChild(b); }
    else nav.appendChild($('<span class="spacer"></span>'));
    if (i<TRIP.days.length-1){ const b=$('<button>'+fmtDate(TRIP.days[i+1].date)+' ›</button>'); b.addEventListener('click', ()=>goDay(1)); nav.appendChild(b); }
    else nav.appendChild($('<span class="spacer"></span>'));
    host.appendChild(nav);

    host.appendChild($('<p class="eyebrow" style="color:'+cityAccent(iso)+'">'+esc(cityForDate(iso))+' · Day '+(dayIndex(iso)+1)+' of '+TRIP.days.length+'</p>'));
    host.appendChild(dayHeadRow(iso));
    host.appendChild($('<p class="sub">'+esc(dayTitle(iso))+'</p>'));
    setOccasionBg(iso);
    const obd = occasionBanner(iso); if (obd) host.appendChild(obd);
    const lnd = occasionReveal(iso); if (lnd) host.appendChild(lnd);
    const hcd = dayHero(iso); if (hcd) host.appendChild(hcd);
    const wcd = weatherChip(iso); if (wcd) host.appendChild(wcd);
    const mbd = mapDayButton(iso); if (mbd) host.appendChild(mbd);
    host.appendChild($('<hr class="rule">'));
    renderDay(iso, host);
    host.appendChild(addStopButton(iso));
    host.appendChild(arrangeButton(iso));
  }

  // ---- unlock UI ----
  function renderLock(host){
    if (!window.SECRETS) return;
    if (CODES){
      const bar = $('<div class="lockbar"><span class="lk">🔓 Codes unlocked for this session</span><button>Lock</button></div>');
      bar.querySelector('button').addEventListener('click', ()=>{ CODES=null; PASS=null; try{sessionStorage.removeItem('andiamo-codes'); sessionStorage.removeItem('andiamo-pass');}catch(e){} render(); });
      host.appendChild(bar);
    } else {
      const wrap = $('<div><div class="lockbar"><span class="lk">🔒 Confirmation codes are locked</span></div><div class="lockrow"><input type="password" inputmode="text" autocomplete="off" placeholder="Family passphrase"><button>Unlock</button></div><p class="lockhint">Codes are encrypted on the page — the passphrase never leaves this device.</p></div>');
      const input = wrap.querySelector('input'), btn = wrap.querySelector('button');
      const go = async ()=>{
        wrap.querySelectorAll('.lockerr').forEach(n=>n.remove());
        try { const map = await decryptSecrets(input.value); CODES = map; PASS = input.value; try{sessionStorage.setItem('andiamo-codes', JSON.stringify(map)); sessionStorage.setItem('andiamo-pass', input.value);}catch(e){} render(); }
        catch(e){ wrap.appendChild($('<p class="lockerr">That passphrase didn’t work — try again.</p>')); }
      };
      btn.addEventListener('click', go);
      input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') go(); });
      host.appendChild(wrap);
    }
  }

  // ---- day prep: auto-built checklist of what a day needs (dress code, tickets, ID, timing) ----
  function dayPrep(iso){
    const evs = eventsOn(iso);
    const wear = [], bring = [], heads = [];
    const seen = new Set();
    const push = (arr, text, detail) => {
      const k = (text+'|'+(detail||'')).toLowerCase();
      if (seen.has(k)) return; seen.add(k); arr.push({ text, detail });
    };

    // dress code — one consolidated reminder listing the day's covered-up sites
    const dress = evs.filter(e=>(e.headsup||[]).some(h=>/👕|shoulders|knees/i.test(h))).map(e=>e.title);
    if (dress.length) push(wear, 'Dress modestly — shoulders & knees covered', dress.join(' · '));

    // hot-weather nudge, if a forecast is loaded
    const wx = wxFor(iso);
    if (wx && wx.hi >= 84) push(wear, 'Sun protection & water', 'Warm day — about '+wx.hi+'°F');

    evs.forEach(e=>{
      if (e.meet) push(heads, 'Meet at '+e.meet.name, e.title+(e.start?' · '+fmtTime(e.start):''));
      if (e.booking && e.pdf) push(bring, e.title+' ticket', 'Open the pass in the app');
      else if (e.booking && (e.type==='ticket'||e.type==='tour')) push(bring, e.title+' booking', 'Confirmation is in the pass');
      (e.headsup||[]).forEach(h=>{
        if (/👕|shoulders|knees/i.test(h)) return;                       // covered above
        else if (/firenze card/i.test(h)) push(bring, 'Firenze Card', e.title);
        else if (/passport|photo id|\bID\b/i.test(h)) push(bring, 'Passport / photo ID', e.title);
        else if (/backpack/i.test(h)) push(bring, 'Leave backpacks behind', h.replace(/^\s*no backpacks\s*[—-]\s*/i,''));
        else if (/steps|no lift/i.test(h)) push(wear, 'Comfortable shoes', e.title+' — '+h);
        else push(heads, h, e.title);                                    // timing / other reminders
      });
    });
    return { wear, bring, heads };
  }

    const p = dayPrep(iso);

    if (!all.length) return null;

  // touch/mouse drag-to-reorder within a list of .arow[data-id] rows
  function makeSortable(list, onChange){
    list.querySelectorAll('.draghandle:not(.locked)').forEach(h=>{
      h.addEventListener('pointerdown', (e)=>{
        const row = h.closest('.arow'); if (!row) return; e.preventDefault();
        try { h.setPointerCapture(e.pointerId); } catch(_){}
        row.classList.add('dragging');
        const move = (ev)=>{
          const y = ev.clientY;
          for (const s of [].filter.call(list.children, c=>c!==row)){
            const r = s.getBoundingClientRect();
            if (y < r.top + r.height/2){ if (row.nextElementSibling!==s) list.insertBefore(row, s); return; }
          }
          if (list.lastElementChild!==row) list.appendChild(row);
        };
        const up = ()=>{
          h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
          row.classList.remove('dragging');
          onChange([].map.call(list.children, c=>c.getAttribute('data-id')));
        };
        h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
      });
    });
  }
  function viewArrange(host, date){
    const back = $('<button class="backbtn">‹ '+fmtDate(date)+'</button>');
    back.addEventListener('click', ()=>{ location.hash = subReturn || ('#day/'+date); });
    host.appendChild(back);
    host.appendChild($('<p class="eyebrow" style="color:'+cityAccent(date)+'">Rearrange</p>'));
    host.appendChild($('<h1 class="title">'+fmtDate(date)+'</h1>'));
    host.appendChild($('<p class="sub">Drag ⠿ to reorder flexible stops. Use “Move to” to send a stop to another day. Timed stops keep their time order.</p>'));

    const evs = eventsOn(date);
    const fixed = evs.filter(e=>e.fixed&&e.start).sort(sortFixed);
    const flex  = applyOrder(date, evs.filter(e=>!(e.fixed&&e.start)));
    const dayOptions = () => TRIP.days.map(d=>'<option value="'+d.date+'"'+(d.date===date?' selected':'')+'>'+esc(fmtDate(d.date))+'</option>').join('');

    function moverRow(e, draggable){
      const lead = draggable ? '<span class="draghandle" title="Drag to reorder">⠿</span>'
                             : '<span class="draghandle locked">'+(e.start?esc(fmtTime(e.start)):'•')+'</span>';
      const row = $('<div class="arow" data-id="'+e._id+'">'+lead+'<span class="aname">'+withGlyph(e)+'</span><select class="amove" aria-label="Move to another day">'+dayOptions()+'</select></div>');
      row.querySelector('.amove').addEventListener('change', (ev)=>{
        const nd = ev.target.value;
        if (nd === e.date) delete OVER.moves[e._id];   // back to its home day -> no override
        else OVER.moves[e._id] = nd;
        if (nd !== date && OVER.order[date]) OVER.order[date] = OVER.order[date].filter(x=>x!==e._id);
        saveOver(true); render();
      });
      return row;
    }

    if (fixed.length){
      host.appendChild($('<p class="sect-label">Timed</p>'));
      fixed.forEach(e=> host.appendChild(moverRow(e, false)));
    }
    if (flex.length){
      host.appendChild($('<p class="sect-label" style="margin-top:14px">Flexible — drag to reorder</p>'));
      const list = $('<div class="alist"></div>');
      flex.forEach(e=> list.appendChild(moverRow(e, true)));
      host.appendChild(list);
      makeSortable(list, (ids)=>{ OVER.order[date] = ids; saveOver(true); });
    }

    host.appendChild($('<hr class="rule">'));
    const pub = $('<button class="act ticket" style="width:100%;justify-content:center">Publish for everyone →</button>');
    pub.addEventListener('click', publishArrangement);
    host.appendChild(pub);
    host.appendChild($('<p class="lockhint">Opens a GitHub issue you submit (as you). Everyone sees the new arrangement in ~1 minute.</p>'));
    const disc = $('<button class="addbtn" style="margin-top:10px">Discard my changes</button>');
    disc.addEventListener('click', ()=>{
      OVER = normOver(null); OVER_DIRTY = false;
      try { localStorage.removeItem('andiamo-over'); localStorage.removeItem('andiamo-over-dirty'); } catch(e){}
      loadRemoteOver(); location.hash = subReturn || ('#day/'+date);
    });
    host.appendChild(disc);
  }

  // ---- router ----
  const TABS = [
    { id:'trips', label:'Trips', icon:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>' },

  ];
  function currentTab(){ const h=(location.hash||'#trips').slice(1); return h.split('/')[0] || 'trips'; }
  function renderTabs(){
    const bar = document.getElementById('tabbar'); bar.innerHTML='';
    const cur = currentTab();
    let active = cur;
    if (cur==='day' || cur==='booking' || cur==='add' || cur==='arrange' || cur==='prep') active = 'days';
    TABS.forEach(t=>{
      const b = $('<button class="tab'+(active===t.id?' on':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+t.icon+'</svg>'+t.label+'</button>');
      b.addEventListener('click', ()=>{ location.hash='#'+t.id; });
      bar.appendChild(b);

  }
  let pendingSlide = null, lastRenderedHash = null;
  function render(){
    const host = document.getElementById('view'); host.innerHTML='';
    const h = (location.hash||'#trips').slice(1);
    setOccasionBg(null);   // day views re-enable it below for a day with an occasion
    if (h.startsWith('day/')) viewDayDetail(host, h.slice(4));
    else if (h.startsWith('prep/')) viewPrep(host, h.slice(5));
    else if (h.startsWith('booking/')) viewBooking(host, h.slice(8));
    else if (h.startsWith('arrange/')) viewArrange(host, h.slice(8));
    else if (h.startsWith('add')) viewAdd(host, h.indexOf('/')>-1 ? h.slice(h.indexOf('/')+1) : TRIP.startDate);
    else if (h==='days') viewDays(host);
    else viewTrips(host);
    renderTabs();
    // play an enter animation only when the route actually changed (not on background re-renders)
    if (h !== lastRenderedHash){
      host.classList.remove('anim-fade','anim-next','anim-prev');
      void host.offsetWidth;
      host.classList.add(pendingSlide==='next' ? 'anim-next' : (pendingSlide==='prev' ? 'anim-prev' : 'anim-fade'));
      window.scrollTo(0,0);
    }
    lastRenderedHash = h; pendingSlide = null;
  }
  window.addEventListener('hashchange', render);
  // On a fresh open: a trip that's happening now — or starting within the next
  // 10 days (so the countdown greets you) — jumps straight to its days;
  // otherwise land on the shelf of trips to relive.
  if (!location.hash || location.hash==='#'){
    const today = todayISO();
    let target = TRIPS.find(t => today >= t.startDate && today <= t.endDate);   // underway
    if (!target){
      target = TRIPS
        .filter(t => today < t.startDate && daysBetween(today, t.startDate) <= 10)   // starting soon
        .sort((a,b)=> a.startDate < b.startDate ? -1 : 1)[0];
    }
    if (target){ selectTrip(target.id); location.hash = '#days'; }
    else location.hash = '#trips';
  }
  render();

  // background refreshes must not wipe a form you're typing in or a drag in progress
  function bgRender(){
    const h = (location.hash||'').slice(1);
    if (h.startsWith('add') || h.startsWith('arrange')) return;
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    render();
  }

  // ---- swipe / arrow-key / tap navigation between days ----
  // the day currently on screen — only a day-detail view swipes between days
  const currentDayISO = () => {
    const h = (location.hash||'').slice(1);
    if (h.startsWith('day/')) return h.slice(4);
    return null;
  };
  function goDay(delta){
    const cur = currentDayISO(); if (!cur) return;
    const i = TRIP.days.findIndex(d=>d.date===cur), j = i + delta;
    if (i<0 || j<0 || j>=TRIP.days.length) return;
    pendingSlide = delta>0 ? 'next' : 'prev';
    location.hash = '#day/'+TRIP.days[j].date;
  }
  (function attachSwipe(){
    const app = document.getElementById('app');
    let x0=null, y0=null, t0=0;
    app.addEventListener('touchstart', (e)=>{ if(e.touches.length!==1){ x0=null; return; } x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); }, {passive:true});
    app.addEventListener('touchend', (e)=>{
      if (x0===null) return;
      const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0; x0=null;
      if (currentDayISO() && dt<600 && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) goDay(dx<0 ? 1 : -1);
    }, {passive:true});
    window.addEventListener('keydown', (e)=>{
      if (!currentDayISO()) return;
      if (e.key==='ArrowLeft') goDay(-1); else if (e.key==='ArrowRight') goDay(1);
    });
  })();

  // ---- refresh weather + pull any items added from a phone (custom.json) ----
  fetchWeather().then(()=>bgRender()).catch(()=>{});
  loadRemoteCustom();
  loadRemoteOver();

  // ---- load encrypted confirmation codes if present (safe: ciphertext only) ----
  (function(){
    const s = document.createElement('script');
    s.src = 'secrets.enc.js';
    s.onload = ()=>{ bgRender(); };
    s.onerror = ()=>{};
    document.head.appendChild(s);
  })();

  // ---- load the anniversary note if present (its own passkey, separate from the codes) ----
  (function(){
    const s = document.createElement('script');
    s.src = 'note.js';
    s.onload = ()=>{ bgRender(); };
    s.onerror = ()=>{};
    document.head.appendChild(s);
  })();

  // ---- offline support ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
