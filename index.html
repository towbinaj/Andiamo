<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andiamo — Italy</title>
<meta name="theme-color" content="#1F5069">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Andiamo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --paper:#F3F1EB; --surface:#FFFFFF; --surface-2:#F7F5F0; --hairline:#E0DACE;
    --ink:#23201B; --muted:#736B5E; --faint:#9A9184;
    --lapis:#1F5069; --lapis-soft:#E4EDF1; --vermilion:#C1442A; --gold:#A9822F; --gold-soft:#F1E7CF; --flor:#3F7D5A; --flor-soft:#E2EFE7;
    --stage-1:#E7E3DA; --stage-2:#DCD6C9; --shadow:26,22,16;
    --serif:"Palatino Linotype",Palatino,"URW Palladio L","Iowan Old Style",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#171A1C; --surface:#1D2226; --surface-2:#22282C; --hairline:#2E353A;
      --ink:#ECE6DA; --muted:#9AA2A6; --faint:#6C757A;
      --lapis:#6FA6C0; --lapis-soft:#1E2B33; --vermilion:#E06A4E; --gold:#CBA85A; --gold-soft:#2C2A22; --flor:#7DBE9A; --flor-soft:#1D2B24;
      --stage-1:#101315; --stage-2:#0A0C0D; --shadow:0,0,0;
    }
  }
  :root[data-theme="light"]{--paper:#F3F1EB;--surface:#FFFFFF;--surface-2:#F7F5F0;--hairline:#E0DACE;--ink:#23201B;--muted:#736B5E;--faint:#9A9184;--lapis:#1F5069;--lapis-soft:#E4EDF1;--vermilion:#C1442A;--gold:#A9822F;--gold-soft:#F1E7CF; --flor:#3F7D5A; --flor-soft:#E2EFE7;--stage-1:#E7E3DA;--stage-2:#DCD6C9;--shadow:26,22,16;}
  :root[data-theme="dark"]{--paper:#171A1C;--surface:#1D2226;--surface-2:#22282C;--hairline:#2E353A;--ink:#ECE6DA;--muted:#9AA2A6;--faint:#6C757A;--lapis:#6FA6C0;--lapis-soft:#1E2B33;--vermilion:#E06A4E;--gold:#CBA85A;--gold-soft:#2C2A22; --flor:#7DBE9A; --flor-soft:#1D2B24;--stage-1:#101315;--stage-2:#0A0C0D;--shadow:0,0,0;}

  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    font-family:var(--sans); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 80% at 50% -10%, var(--stage-1), var(--stage-2)); background-attachment:fixed;
  }
  #app { max-width:520px; margin:0 auto; min-height:100%; background:var(--paper);
    box-shadow:0 0 60px -20px rgba(var(--shadow),.4); display:flex; flex-direction:column;
    padding-bottom:calc(76px + env(safe-area-inset-bottom,0px)); }
  .view { padding:22px 18px 8px; padding-top:calc(22px + env(safe-area-inset-top, 0px)); }
  .view.anim-fade { animation: aFade .22s ease both; }
  .view.anim-next { animation: aNext .28s cubic-bezier(.2,.7,.2,1) both; }
  .view.anim-prev { animation: aPrev .28s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes aFade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  @keyframes aNext { from{opacity:0;transform:translateX(28px)} to{opacity:1;transform:none} }
  @keyframes aPrev { from{opacity:0;transform:translateX(-28px)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion: reduce){ .view.anim-fade,.view.anim-next,.view.anim-prev{animation:none} }

  /* day-to-day nav (swipe / arrows / tap) */
  .daynav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 4px; }
  .daynav button { font:inherit; font-size:13.5px; font-weight:600; color:var(--lapis); background:var(--surface); border:1px solid var(--hairline); border-radius:10px; padding:9px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .daynav button:hover { border-color:var(--lapis); }
  .daynav .spacer { flex:1; }

  .eyebrow { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--lapis); font-weight:700; display:flex; gap:7px; align-items:center; margin:0; }
  .eyebrow .live { width:7px; height:7px; border-radius:50%; background:var(--vermilion); box-shadow:0 0 0 3px color-mix(in srgb, var(--vermilion) 24%, transparent); }
  h1.title { font-family:var(--serif); font-size:33px; line-height:1.03; margin:8px 0 3px; letter-spacing:-.01em; }
  .sub { font-size:15.5px; color:var(--muted); margin:0; }
  .rule { height:1px; background:var(--hairline); border:0; margin:18px 0 15px; }
  .sect-label { font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0 0 11px; }

  /* hero / countdown */
  .hero { background:linear-gradient(135deg, var(--lapis), #2C7D6E 52%, var(--gold)); border:0; border-radius:18px; padding:26px; text-align:center; margin-bottom:8px; color:#fff; box-shadow:0 16px 34px -20px rgba(var(--shadow),.7); }
  .hero .big { font-family:var(--serif); font-size:56px; line-height:1; color:#fff; margin:6px 0; font-variant-numeric:tabular-nums; text-shadow:0 2px 12px rgba(0,0,0,.18); }
  .hero .cap { font-size:15.5px; color:rgba(255,255,255,.9); margin:0; }

  /* per-day hero photo (same footprint as the countdown hero) */
  .dayhero { position:relative; border-radius:18px; overflow:hidden; height:158px; margin:12px 0 4px; background:var(--surface-2); box-shadow:0 16px 34px -20px rgba(var(--shadow),.7); }
  .dayhero img { width:100%; height:100%; object-fit:cover; display:block; }
  .dayhero .dhcap { position:absolute; left:0; right:0; bottom:0; padding:30px 16px 13px; color:#fff; font-family:var(--serif); font-size:21px; font-weight:600; text-shadow:0 1px 10px rgba(0,0,0,.55); background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,.1) 60%, transparent); }
  .dayhero .dhtag { position:absolute; top:11px; left:12px; font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#fff; background:rgba(0,0,0,.35); backdrop-filter:blur(3px); padding:5px 9px; border-radius:999px; }

  /* up-next highlight */
  .upnext { background:color-mix(in srgb, var(--vermilion) 8%, var(--surface)); border:1px solid color-mix(in srgb, var(--vermilion) 30%, var(--hairline)); border-radius:14px; padding:16px 17px; margin-bottom:14px; width:100%; text-align:left; font:inherit; color:inherit; display:block; }
  .upnext.tap { cursor:pointer; display:grid; grid-template-columns:1fr 18px; align-items:center; gap:8px; }
  .upnext .k { font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin:0 0 5px; }
  .upnext .n { font-size:19px; font-weight:600; margin:0; }
  .upnext .t { font-family:var(--mono); font-size:14px; color:var(--muted); margin:4px 0 0; }
  .upnext .chev { color:var(--vermilion); font-size:22px; }

  /* event row */
  .ev { display:grid; grid-template-columns:58px 1fr auto; gap:13px; padding:14px 0; border-top:1px solid var(--hairline); }
  .ev:first-of-type { border-top:0; }
  .ev .ctl { display:flex; align-items:center; gap:9px; }
  .checkbtn { width:27px; height:27px; border-radius:50%; border:2px solid var(--hairline); background:var(--surface); color:transparent; font-size:15px; font-weight:800; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex:none; }
  .checkbtn.on { background:var(--lapis); border-color:var(--lapis); color:#fff; }
  .ev.done { opacity:.55; }
  .ev.done .name { text-decoration:line-through; }
  .wx { font-size:14px; color:var(--muted); background:linear-gradient(120deg, var(--lapis-soft), var(--gold-soft)); border:1px solid var(--hairline); border-radius:11px; padding:10px 13px; margin-top:12px; }
  .wx b { color:var(--ink); font-weight:700; }
  .wx .sep { color:var(--faint); margin:0 3px; }
  .ev .time { font-family:var(--mono); font-size:14.5px; color:var(--ink); font-variant-numeric:tabular-nums; padding-top:2px; font-weight:600; }
  .ev .time.flex { color:var(--faint); font-weight:400; }
  .ev .name { font-size:17.5px; font-weight:600; margin:0; line-height:1.25; }
  .ev .meta { font-size:14.5px; color:var(--muted); margin:5px 0 0; }
  .badges { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
  .badge { font-size:13px; font-weight:600; padding:5px 11px; border-radius:8px; display:inline-flex; gap:5px; align-items:center; }
  .badge.info { background:var(--lapis-soft); color:var(--lapis); }
  .badge.warn { background:color-mix(in srgb, var(--vermilion) 12%, transparent); color:var(--vermilion); }
  .badge.opt { background:var(--surface-2); color:var(--faint); border:1px solid var(--hairline); }
  .badge.book { background:var(--gold-soft); color:var(--gold); }
  .actions { display:flex; gap:9px; margin-top:12px; flex-wrap:wrap; }
  .act { font:inherit; font-size:14.5px; font-weight:600; text-decoration:none; color:var(--lapis); border:1px solid var(--hairline); background:var(--surface); padding:10px 15px; border-radius:9px; display:inline-flex; gap:6px; align-items:center; cursor:pointer; }
  .act:active { transform:translateY(1px); }
  .act.ticket { color:var(--gold); border-color:var(--gold); background:var(--gold-soft); }
  .badge.add { background:var(--flor-soft); color:var(--flor); }
  .addbtn { width:100%; margin-top:16px; font:inherit; font-size:15px; font-weight:600; color:var(--lapis); background:var(--surface); border:1.5px dashed var(--hairline); border-radius:12px; padding:15px; cursor:pointer; }
  .addbtn:hover { border-color:var(--lapis); background:var(--lapis-soft); }
  .addform { display:flex; flex-direction:column; gap:15px; margin-top:16px; }
  .addform label { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:700; color:var(--muted); }
  .addform input, .addform select, .addform textarea { font:inherit; font-size:16px; padding:12px 13px; border:1px solid var(--hairline); border-radius:10px; background:var(--surface); color:var(--ink); }
  .addform input:focus, .addform select:focus, .addform textarea:focus { outline:2px solid var(--lapis); border-color:var(--lapis); }
  .addform textarea { resize:vertical; }
  .meet { margin-top:12px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:11px; padding:13px 14px; }
  .meet .mk { font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--lapis); font-weight:700; margin:0 0 6px; }
  .meet p { font-size:14.5px; color:var(--ink); margin:0; line-height:1.5; }
  .meet .look { color:var(--muted); margin-top:6px; }
  .note { font-size:14px; color:var(--muted); margin:9px 0 0; font-style:italic; }

  /* tappable booking row — opens the pass */
  .ev.bkrow { grid-template-columns:58px 1fr auto; align-items:center; border:1px solid var(--hairline); border-left:4px solid var(--lapis); border-radius:12px; padding:14px 15px; margin:12px 0; background:var(--surface); width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; }
  .ev.bkrow:hover { border-color:var(--lapis); }
  .ev.bkrow:focus-visible { outline:2px solid var(--lapis); outline-offset:2px; }
  .ev.bkrow.t-flight { border-left-color:#40596B; }
  .ev.bkrow.t-tour { border-left-color:#566B3E; }
  .ev.bkrow.t-ticket { border-left-color:var(--gold); }
  .ev.bkrow.t-meal { border-left-color:#833E4E; }
  .ev.bkrow.t-transit { border-left-color:#564a5f; }
  .ev.bkrow .bksub { font-size:14px; color:var(--muted); margin:5px 0 0; font-family:var(--mono); }
  .ev.bkrow .chev { color:var(--faint); font-size:23px; align-self:center; justify-self:end; }

  /* day list */
  .leg-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:2px 0 3px; }
  .leg-city { font-family:var(--serif); font-size:24px; margin:0; }
  .leg-dates { font-family:var(--mono); font-size:13px; color:var(--muted); }
  .leg-hotel { font-size:14px; color:var(--muted); margin:0 0 7px; }
  .bookend { text-align:center; font-family:var(--mono); font-size:13px; letter-spacing:.03em; color:var(--faint); padding:13px 0 5px; }
  .bookend span { background:var(--surface); border:1px solid var(--hairline); padding:7px 13px; border-radius:999px; }
  .daycard { width:100%; text-align:left; background:var(--surface); border:1px solid var(--hairline); border-radius:13px; padding:15px 16px; margin-top:10px; display:grid; grid-template-columns:48px 1fr auto; gap:13px; align-items:center; cursor:pointer; font:inherit; color:inherit; }
  .daycard:hover { border-color:var(--lapis); }
  .daycard .dn { font-family:var(--serif); font-size:21px; color:var(--lapis); text-align:center; line-height:1; }
  .daycard .dn small { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--faint); text-transform:uppercase; margin-top:4px; }
  .daycard .dt { font-size:16.5px; font-weight:600; margin:0; }
  .daycard .dm { font-size:14px; color:var(--muted); margin:3px 0 0; }
  .daycard .chev { color:var(--faint); font-size:23px; }
  .dots { display:flex; gap:4px; margin-top:7px; }
  .dot { width:7px; height:7px; border-radius:50%; }

  /* booking pass (tapped from the itinerary) */
  .pass { border:1px solid var(--hairline); border-radius:16px; overflow:hidden; background:var(--surface); margin-top:6px; box-shadow:0 12px 28px -18px rgba(var(--shadow),.55); }
  .pass .band { padding:18px; color:#fff; }
  .pass .band.t-flight { background:linear-gradient(135deg,#2B3A46,#40596B); }
  .pass .band.t-tour { background:linear-gradient(135deg,#3B4A2E,#566B3E); }
  .pass .band.t-ticket { background:linear-gradient(135deg,#6E5A17,#8C7320); }
  .pass .band.t-meal { background:linear-gradient(135deg,#5A2733,#833E4E); }
  .pass .band.t-transit { background:linear-gradient(135deg,#3a3340,#564a5f); }
  .pass .pn { font-family:var(--serif); font-size:24px; margin:0; line-height:1.08; }
  .pass .pv { font-size:14px; opacity:.92; margin:6px 0 0; }
  .pass .pw { font-family:var(--mono); font-size:14px; opacity:.95; margin:10px 0 0; }
  .pass .stub { padding:16px 18px; border-top:1px dashed var(--hairline); display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .pass .stub .lbl { font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0 0 6px; }
  .pass .stub .val { font-family:var(--mono); font-size:20px; font-weight:700; color:var(--gold); margin:0; }
  .pass .stub .qty { font-size:14px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .pass .pbody { padding:16px 18px; }
  .pass .pbody > *:first-child { margin-top:0; }

  /* unlock */
  .lockbar { display:flex; gap:10px; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--hairline); border-radius:12px; padding:11px 13px; margin-top:6px; }
  .lockbar .lk { font-size:14px; color:var(--muted); }
  .lockrow button, .lockbar button { font:inherit; font-size:14px; font-weight:600; border:1px solid var(--lapis); color:var(--lapis); background:none; border-radius:9px; padding:10px 15px; cursor:pointer; white-space:nowrap; }
  .lockrow { display:flex; gap:8px; margin-top:9px; }
  .lockrow input { flex:1; min-width:0; font:inherit; font-size:16px; padding:11px 13px; border:1px solid var(--hairline); border-radius:9px; background:var(--surface); color:var(--ink); }
  .lockrow input:focus { outline:2px solid var(--lapis); outline-offset:0; border-color:var(--lapis); }
  .lockhint { font-size:13px; color:var(--faint); margin:9px 0 0; }
  .lockerr { font-size:13.5px; color:var(--vermilion); font-weight:600; margin:9px 0 0; }

  /* trip tab */
  .card { background:var(--surface); border:1px solid var(--hairline); border-radius:13px; padding:16px; margin-top:13px; }
  .card h3 { font-size:16px; margin:0 0 9px; }
  .card p { font-size:14.5px; color:var(--muted); margin:5px 0; }
  .card p b { color:var(--ink); }
  ul.plain { margin:7px 0 0; padding-left:19px; }
  ul.plain li { font-size:14.5px; color:var(--muted); margin:6px 0; }

  .backbtn { background:none; border:0; color:var(--lapis); font:inherit; font-size:15px; font-weight:600; padding:0 0 10px; cursor:pointer; display:inline-flex; gap:5px; align-items:center; }

  /* tab bar */
  .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
    display:grid; grid-template-columns:repeat(3,1fr); background:var(--surface); border-top:1px solid var(--hairline);
    padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px)); z-index:20; }
  .tab { border:0; background:none; font:inherit; cursor:pointer; text-align:center; font-size:11.5px; font-weight:600; color:var(--faint); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .tab.on { color:var(--lapis); }
  .tab svg { width:23px; height:23px; }
  .foot-note { text-align:center; font-size:12.5px; color:var(--faint); padding:18px; }
</style>
</head>
<body>
<div id="app"><div class="view" id="view"></div></div>
<nav class="tabbar" id="tabbar"></nav>

<script src="trip-data.js"></script>
<script>
(function(){
  "use strict";
  const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
  const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const params = new URLSearchParams(location.search);

  // ---- confirmation-code unlock (client-side AES-GCM) ----
  let CODES = null, PASS = null;
  try { const s = sessionStorage.getItem('andiamo-codes'); if (s) CODES = JSON.parse(s); } catch(e){}
  try { PASS = sessionStorage.getItem('andiamo-pass'); } catch(e){}
  const b64d = (s) => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

  // decrypt an encrypted ticket PDF (tickets/<key>.enc = [16 salt][12 iv][ciphertext]).
  // `win` is a tab opened synchronously on tap (so iOS doesn't block it); we point it at the PDF.
  async function openTicket(key, win){
    if (!PASS) throw new Error('locked');
    const r = await fetch('tickets/'+key+'.enc', {cache:'no-store'});
    if (!r.ok) throw new Error('missing');
    const buf = new Uint8Array(await r.arrayBuffer());
    const salt = buf.slice(0,16), iv = buf.slice(16,28), ct = buf.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(PASS), 'PBKDF2', false, ['deriveKey']);
    const dk = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, dk, ct);
    const url = URL.createObjectURL(new Blob([pt], {type:'application/pdf'}));
    if (win && !win.closed) { win.location.href = url; }             // use the pre-opened tab
    else {                                                            // fallback if it was blocked
      const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
    setTimeout(()=>URL.revokeObjectURL(url), 120000);
  }
  async function decryptSecrets(pass){
    const s = window.SECRETS; if(!s) throw new Error('no secrets');
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(s.salt), iterations:s.iter, hash:s.hash}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(s.iv)}, key, b64d(s.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const codeFor = (e) => (e && e.codeKey && CODES && CODES[e.codeKey]) ? CODES[e.codeKey] : null;
  const bookVal = (e) => codeFor(e) || (e.booking ? e.booking.value : '');
  const bookLabel = (e) => codeFor(e) ? 'Confirmation' : (e.booking ? e.booking.label : '');

  // ---- check off places (saved on this device) ----
  let DONE = {};
  try { DONE = JSON.parse(localStorage.getItem('andiamo-done') || '{}') || {}; } catch(e){}
  const isDone = (idx) => !!DONE[idx];
  function toggleDone(idx){
    if (DONE[idx]) delete DONE[idx]; else DONE[idx] = 1;
    try { localStorage.setItem('andiamo-done', JSON.stringify(DONE)); } catch(e){}
  }
  function checkButton(idx){
    const b = $('<button class="checkbtn'+(isDone(idx)?' on':'')+'" aria-label="Mark as done">✓</button>');
    b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      toggleDone(idx);
      const on = isDone(idx);
      b.classList.toggle('on', on);          // update in place — no re-render, no scroll jump
      const row = b.closest('.ev');
      if (row) row.classList.toggle('done', on);
    });
    return b;
  }

  // ---- custom items (added via "Send to trip" -> GitHub issue -> Action -> custom.json) ----
  TRIP.events.forEach((e,i)=>{ e._id = String(i); });   // stable id for trip events (keeps check-off keys)
  let CUSTOM = [];
  (function loadLocalCustom(){
    try { const a = JSON.parse(localStorage.getItem('andiamo-custom')||'[]'); if (Array.isArray(a)) CUSTOM = a; } catch(e){}
    CUSTOM.forEach(e=>{ e._id = e.id; });
  })();
  const allEvents = () => TRIP.events.concat(CUSTOM);
  async function loadRemoteCustom(){
    try {
      const r = await fetch('custom.json?_='+Date.now(), {cache:'no-store'});
      if (!r.ok) return; const arr = await r.json(); if (!Array.isArray(arr)) return;
      arr.forEach(e=>{ e._id = e.id; });
      CUSTOM = arr;
      try { localStorage.setItem('andiamo-custom', JSON.stringify(arr)); } catch(e){}
      render();
    } catch(e){}
  }
  const GH_REPO = 'towbinaj/Andiamo';   // where "Send to trip" opens an issue

  // ---- weather + sunrise/sunset (Open-Meteo, no key; cached for offline) ----
  const CITY_COORD = { Rome:{lat:41.9028,lon:12.4964}, Florence:{lat:43.7696,lon:11.2558} };
  let WX = null;
  try { WX = JSON.parse(localStorage.getItem('andiamo-wx') || 'null'); } catch(e){}
  async function fetchWeather(){
    const city = {};
    for (const name of Object.keys(CITY_COORD)){
      const c = CITY_COORD[name];
      const url = 'https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lon+
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Europe%2FRome&temperature_unit=fahrenheit&start_date='+TRIP.startDate+'&end_date='+TRIP.endDate;
      const r = await fetch(url); if(!r.ok) throw new Error('wx'); const j = await r.json();
      const days = {};
      (j.daily.time||[]).forEach((d,i)=>{ days[d] = { code:j.daily.weather_code[i], hi:Math.round(j.daily.temperature_2m_max[i]), lo:Math.round(j.daily.temperature_2m_min[i]), sr:j.daily.sunrise[i], ss:j.daily.sunset[i] }; });
      city[name] = days;
    }
    WX = { at: new Date().toISOString(), city };
    try { localStorage.setItem('andiamo-wx', JSON.stringify(WX)); } catch(e){}
  }
  const wxFor = (iso) => { if(!WX||!WX.city) return null; const c = WX.city[cityForDate(iso)]; return (c && c[iso]) || null; };
  function wxDesc(code){
    const m = {0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌦️','Drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],80:['🌦️','Showers'],81:['🌦️','Showers'],82:['⛈️','Heavy showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Storm'],99:['⛈️','Storm']};
    return m[code] || ['🌡️',''];
  }
  const clock = (dt) => { if(!dt) return ''; const t=String(dt).split('T')[1]; return t ? fmtTime(t.slice(0,5)) : ''; };
  function weatherChip(iso){
    const w = wxFor(iso); if(!w) return null;
    const d = wxDesc(w.code);
    return $('<div class="wx">'+d[0]+' <b>'+w.hi+'°</b> / '+w.lo+'°F · '+esc(d[1])+
      '<span class="sep">·</span>☀ '+clock(w.sr)+'<span class="sep">·</span>🌙 '+clock(w.ss)+'</div>');
  }

  // per-day hero photo of the day's highlight
  function dayHero(iso){
    const d = TRIP.days.find(x=>x.date===iso);
    if (!d || !d.photo) return null;
    return $('<div class="dayhero"><img loading="lazy" decoding="async" src="'+esc(d.photo)+'" alt="'+esc(d.highlight||'')+'">'+
      '<span class="dhtag">Today’s highlight</span>'+
      (d.highlight ? '<div class="dhcap">'+esc(d.highlight)+'</div>' : '')+'</div>');
  }

  // ---- date helpers ----
  const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const asDate = (iso) => new Date(iso+'T12:00:00');
  const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const dow = (iso) => WD[asDate(iso).getDay()];
  const fmtDate = (iso) => { const d=asDate(iso); return WD[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate(); };
  const fmtTime = (hm) => { if(!hm) return null; let [h,m]=hm.split(':').map(Number); const ap=h<12?'AM':'PM'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; };
  const daysBetween = (a,b) => Math.round((asDate(b)-asDate(a))/86400000);

  const cityForDate = (iso) => { let c=TRIP.legs[0].city; for(const l of TRIP.legs){ if(iso>=l.start) c=l.city; } return c; };
  const dayTitle = (iso) => { const d=TRIP.days.find(x=>x.date===iso); return d?d.title:''; };
  const dayIndex = (iso) => TRIP.days.findIndex(x=>x.date===iso);
  const eventsOn = (iso) => allEvents().filter(e=>e.date===iso);
  const mapURL = (e) => 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.address || (e.title+', '+cityForDate(e.date)));

  const sortFixed = (a,b) => (a.start||'').localeCompare(b.start||'');

  const badgeCls = (h) => /👕/.test(h) ? 'info' : (/ID|passport|backpack|steps|early|sharp|Firenze|Check in/i.test(h) ? 'warn' : 'info');

  // colorful glyph per event type, and city-based accent colour (Rome=blue, Florence=green)
  const TYPE_EMOJI = { flight:'✈️', transit:'🚆', tour:'🎨', ticket:'🎫', meal:'🍷', sight:'📍' };
  const glyph = (e) => (TYPE_EMOJI[e.type] || '📍');
  const cityAccent = (iso) => cityForDate(iso)==='Florence' ? 'var(--flor)' : 'var(--lapis)';

  // ---- render one event ----
  // A booked event becomes a tappable row that opens its pass (see viewBooking).
  function renderEvent(e){
    const t = e.start ? fmtTime(e.start) : (e.type==='meal'?'dinner':'○');
    const id = e._id;
    const done = isDone(id) ? ' done' : '';

    if (e.booking){
      const sub = '🎟 ' + esc(bookVal(e)) + (e.booking.source ? ' · ' + esc(e.booking.source) : '');
      const node = $(
        '<div class="ev bkrow t-'+e.type+done+'" role="button" tabindex="0">'+
          '<div class="time'+(e.start?'':' flex')+'">'+esc(t)+'</div>'+
          '<div class="body"><p class="name">'+glyph(e)+' '+esc(e.title)+'</p><p class="bksub">'+sub+'</p></div>'+
          '<div class="ctl"><span class="chev">›</span></div>'+
        '</div>'
      );
      node.querySelector('.ctl').insertBefore(checkButton(id), node.querySelector('.chev'));
      const open = ()=>{ location.hash = '#booking/'+id; };
      node.addEventListener('click', open);
      node.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); open(); } });
      return node;
    }

    const badges = [];
    if (e.optional) badges.push('<span class="badge opt">optional</span>');
    if (e.custom) badges.push('<span class="badge add">added</span>');
    (e.headsup||[]).forEach(h=> badges.push('<span class="badge '+badgeCls(h)+'">'+esc(h)+'</span>'));

    const actions = [];
    if (e.address || e.type==='sight' || e.type==='meal')
      actions.push('<a class="act" target="_blank" rel="noopener" href="'+mapURL(e)+'">📍 Directions</a>');

    const node = $(
      '<div class="ev'+done+'">'+
        '<div class="time'+(e.start?'':' flex')+'">'+esc(t)+'</div>'+
        '<div class="body">'+
          '<p class="name">'+glyph(e)+' '+esc(e.title)+'</p>'+
          (badges.length?'<div class="badges">'+badges.join('')+'</div>':'')+
          (e.note?'<p class="note">'+esc(e.note)+'</p>':'')+
          (actions.length?'<div class="actions">'+actions.join('')+'</div>':'')+
        '</div>'+
        '<div class="ctl"></div>'+
      '</div>'
    );
    node.querySelector('.ctl').appendChild(checkButton(id));
    return node;
  }

  // ---- render a full day's events into a container ----
  function renderDay(iso, host){
    const evs = eventsOn(iso);
    const fixed = evs.filter(e=>e.fixed && e.start).sort(sortFixed);
    const flex  = evs.filter(e=>!(e.fixed && e.start));
    if (fixed.length){
      host.appendChild($('<p class="sect-label">Scheduled</p>'));
      fixed.forEach(e=>host.appendChild(renderEvent(e)));
    }
    if (flex.length){
      if (fixed.length) host.appendChild($('<hr class="rule">'));
      host.appendChild($('<p class="sect-label">Flexible · any order</p>'));
      flex.forEach(e=>host.appendChild(renderEvent(e)));
    }
  }

  // ---- TODAY ----
  function viewToday(host){
    const real = todayISO();
    const override = params.get('date');
    const start = TRIP.startDate, end = TRIP.endDate;

    // pre-trip countdown
    if (!override && real < start){
      const n = daysBetween(real, start);
      host.appendChild($('<p class="eyebrow">'+esc(TRIP.subtitle)+'</p>'));
      host.appendChild($('<h1 class="title">'+esc(TRIP.name)+'</h1>'));
      host.appendChild($('<p class="sub">'+fmtDate(start)+' – '+fmtDate(end)+' · '+TRIP.partySize+' travelers</p>'));
      host.appendChild($('<div class="hero"><p class="cap">Trip begins in</p><p class="big">'+n+'</p><p class="cap">'+(n===1?'day':'days')+' — see you in Rome ✈</p></div>'));
      host.appendChild($('<hr class="rule">'));
      host.appendChild($('<p class="sect-label">First day · '+fmtDate(start)+'</p>'));
      const wc0 = weatherChip(start); if (wc0) host.appendChild(wc0);
      renderDay(start, host);
      return;
    }

    let cur = override || real;
    if (cur < start) cur = start;
    if (cur > end) {
      host.appendChild($('<p class="eyebrow">'+esc(TRIP.subtitle)+'</p>'));
      host.appendChild($('<h1 class="title">Buon viaggio!</h1>'));
      host.appendChild($('<p class="sub">The trip has wrapped — browse it any time in Days.</p>'));
      return;
    }

    const idx = dayIndex(cur);
    const isReal = (cur === real);
    host.appendChild($('<p class="eyebrow" style="color:'+cityAccent(cur)+'">'+(isReal?'<span class="live"></span>':'')+esc(cityForDate(cur))+' · Day '+(idx+1)+' of '+TRIP.days.length+'</p>'));
    host.appendChild($('<h1 class="title">'+fmtDate(cur)+'</h1>'));
    host.appendChild($('<p class="sub">'+esc(dayTitle(cur))+'</p>'));
    const hcur = dayHero(cur); if (hcur) host.appendChild(hcur);
    const wcur = weatherChip(cur); if (wcur) host.appendChild(wcur);

    // up-next: next fixed event today (by real clock if today, else first)
    const fixed = eventsOn(cur).filter(e=>e.fixed && e.start).sort(sortFixed);
    let up = null;
    if (isReal){ const now=new Date(); const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'); up = fixed.find(e=>e.start>=hm) || null; }
    else up = fixed[0] || null;
    if (up){
      const tap = up.booking ? ' tap' : '';
      const chev = up.booking ? '<div class="chev">›</div>' : '';
      const un = $('<'+(up.booking?'button':'div')+' class="upnext'+tap+'"><div><p class="k">'+(isReal?'Up next':'First fixed time')+'</p><p class="n">'+glyph(up)+' '+esc(up.title)+'</p><p class="t">'+esc(fmtTime(up.start))+(up.booking?' · '+esc(bookVal(up)):'')+'</p></div>'+chev+'</'+(up.booking?'button':'div')+'>');
      if (up.booking) un.addEventListener('click', ()=>{ location.hash='#booking/'+up._id; });
      host.appendChild(un);
    }
    host.appendChild($('<hr class="rule">'));
    renderDay(cur, host);
    host.appendChild(addStopButton(cur));
  }

  // ---- DAYS ----
  function viewDays(host){
    host.appendChild($('<p class="eyebrow">The whole trip</p>'));
    host.appendChild($('<h1 class="title">Days</h1>'));
    host.appendChild($('<p class="sub">'+fmtDate(TRIP.startDate)+' – '+fmtDate(TRIP.endDate)+' · '+TRIP.legs.length+' cities</p>'));
    host.appendChild($('<hr class="rule">'));

    // arrival bookend
    const arr = TRIP.events.find(e=>e.type==='flight' && e.date===TRIP.startDate);
    if (arr) host.appendChild($('<div class="bookend"><span>✈ '+esc(arr.title)+' · '+fmtDate(arr.date)+' · '+esc(fmtTime(arr.start))+'</span></div>'));

    TRIP.legs.forEach((leg, li)=>{
      const accent = leg.city==='Florence' ? 'var(--flor)' : 'var(--lapis)';
      host.appendChild($('<div style="margin-top:14px"><div class="leg-head"><h3 class="leg-city" style="color:'+accent+'">'+esc(leg.city)+'</h3><span class="leg-dates">'+MO[asDate(leg.start).getMonth()]+' '+asDate(leg.start).getDate()+'–'+asDate(leg.end).getDate()+'</span></div><p class="leg-hotel">🏨 '+esc(leg.hotelName)+'</p></div>'));
      TRIP.days.filter(d=> d.date>=leg.start && d.date<(li<TRIP.legs.length-1?TRIP.legs[li+1].start:'9999') ).forEach(d=>{
        const evs = eventsOn(d.date);
        const hasBook = evs.some(e=>e.booking);
        const hasFixed = evs.some(e=>e.fixed && e.start && e.type!=='meal');
        const summary = evs.filter(e=>e.fixed && e.start).sort(sortFixed).map(e=>e.title.split(' — ')[0].split(' (')[0]).slice(0,3).join(' · ') || 'Open day';
        const dots = (hasFixed?'<span class="dot" style="background:'+accent+'"></span>':'')+(hasBook?'<span class="dot" style="background:var(--gold)"></span>':'');
        const card = $('<button class="daycard" style="border-left:4px solid '+accent+'"><div class="dn" style="color:'+accent+'">'+(dayIndex(d.date)+1)+'<small>'+dow(d.date)+'</small></div><div><p class="dt">'+esc(d.title)+'</p><p class="dm">'+esc(summary)+'</p><div class="dots">'+dots+'</div></div><div class="chev">›</div></button>');
        card.addEventListener('click', ()=>{ location.hash='#day/'+d.date; });
        host.appendChild(card);
      });
    });

    const dep = TRIP.events.find(e=>e.type==='flight' && e.date===TRIP.endDate);
    if (dep) host.appendChild($('<div class="bookend"><span>✈ '+esc(dep.title)+' · '+fmtDate(dep.date)+' · '+esc(fmtTime(dep.start))+'</span></div>'));
  }

  // ---- single DAY detail ----
  function viewDayDetail(host, iso){
    const back = $('<button class="backbtn">‹ Days</button>');
    back.addEventListener('click', ()=>{ location.hash='#days'; });
    host.appendChild(back);

    // prev / next day (also swipe & arrow keys)
    const i = dayIndex(iso);
    const nav = $('<div class="daynav"></div>');
    if (i>0){ const b=$('<button>‹ '+fmtDate(TRIP.days[i-1].date)+'</button>'); b.addEventListener('click', ()=>goDay(-1)); nav.appendChild(b); }
    else nav.appendChild($('<span class="spacer"></span>'));
    if (i<TRIP.days.length-1){ const b=$('<button>'+fmtDate(TRIP.days[i+1].date)+' ›</button>'); b.addEventListener('click', ()=>goDay(1)); nav.appendChild(b); }
    else nav.appendChild($('<span class="spacer"></span>'));
    host.appendChild(nav);

    host.appendChild($('<p class="eyebrow" style="color:'+cityAccent(iso)+'">'+esc(cityForDate(iso))+' · Day '+(dayIndex(iso)+1)+' of '+TRIP.days.length+'</p>'));
    host.appendChild($('<h1 class="title">'+fmtDate(iso)+'</h1>'));
    host.appendChild($('<p class="sub">'+esc(dayTitle(iso))+'</p>'));
    const hcd = dayHero(iso); if (hcd) host.appendChild(hcd);
    const wcd = weatherChip(iso); if (wcd) host.appendChild(wcd);
    host.appendChild($('<hr class="rule">'));
    renderDay(iso, host);
    host.appendChild(addStopButton(iso));
  }

  // ---- BOOKING pass (tapped from a day / today) ----
  function viewBooking(host, id){
    const e = allEvents().find(x=>x._id===String(id));
    if (!e || !e.booking){ location.hash='#days'; return; }
    const back = $('<button class="backbtn">‹ '+fmtDate(e.date)+'</button>');
    back.addEventListener('click', ()=>{ location.hash='#day/'+e.date; });
    host.appendChild(back);

    const pw = dow(e.date)+' '+MO[asDate(e.date).getMonth()]+' '+asDate(e.date).getDate()+(e.start?' · '+fmtTime(e.start):'');
    const pass = $(
      '<div class="pass">'+
        '<div class="band t-'+e.type+'">'+
          '<p class="pn">'+glyph(e)+' '+esc(e.title)+'</p>'+
          '<p class="pv">'+esc(cityForDate(e.date))+(e.booking.source?' · '+esc(e.booking.source):'')+'</p>'+
          '<p class="pw">'+esc(pw)+'</p>'+
        '</div>'+
        '<div class="stub"><div><p class="lbl">'+esc(bookLabel(e))+'</p><p class="val">'+esc(bookVal(e))+'</p></div>'+(e.qty?'<span class="qty">🎟 ×'+e.qty+'</span>':'')+'</div>'+
        '<div class="pbody"></div>'+
      '</div>'
    );
    host.appendChild(pass);
    const pb = pass.querySelector('.pbody');
    if (e.headsup && e.headsup.length)
      pb.appendChild($('<div class="badges">'+e.headsup.map(h=>'<span class="badge '+badgeCls(h)+'">'+esc(h)+'</span>').join('')+'</div>'));
    if (e.meet)
      pb.appendChild($('<div class="meet"><p class="mk">Meeting point</p><p><b>'+esc(e.meet.name)+'</b> · '+esc(e.meet.address)+'</p>'+(e.meet.look?'<p class="look">'+esc(e.meet.look)+'</p>':'')+'</div>'));
    if (e.note) pb.appendChild($('<p class="note">'+esc(e.note)+'</p>'));
    const acts = $('<div class="actions"><a class="act" target="_blank" rel="noopener" href="'+mapURL(e)+'">📍 Directions</a></div>');
    if (e.pdf && PASS){
      const tb = $('<button class="act ticket">📄 View ticket (PDF)</button>');
      tb.addEventListener('click', ()=>{
        const win = window.open('', '_blank');   // open the tab NOW, inside the tap, so iOS allows it
        tb.textContent = 'Opening…';
        openTicket(e.pdf, win)
          .then(()=>{ tb.textContent = '📄 View ticket (PDF)'; })
          .catch((err)=>{
            if (win && !win.closed) win.close();
            tb.textContent = String(err && err.message)==='missing' ? 'Ticket file not added yet' : 'Couldn’t open — tap again';
            setTimeout(()=>{ tb.textContent = '📄 View ticket (PDF)'; }, 2500);
          });
      });
      acts.appendChild(tb);
    }
    pb.appendChild(acts);
    if (e.pdf && CODES && !PASS)
      pb.appendChild($('<p class="note">Re-unlock on the Trip tab to view the ticket PDF.</p>'));

    // if this booking has a hidden code and we're locked, offer to unlock right here
    if (window.SECRETS && !CODES && e.codeKey){
      host.appendChild($('<hr class="rule">'));
      host.appendChild($('<p class="sect-label">Reveal confirmation code</p>'));
      renderLock(host);
    }
  }

  // ---- unlock UI ----
  function renderLock(host){
    if (!window.SECRETS) return;
    if (CODES){
      const bar = $('<div class="lockbar"><span class="lk">🔓 Codes unlocked for this session</span><button>Lock</button></div>');
      bar.querySelector('button').addEventListener('click', ()=>{ CODES=null; PASS=null; try{sessionStorage.removeItem('andiamo-codes'); sessionStorage.removeItem('andiamo-pass');}catch(e){} render(); });
      host.appendChild(bar);
    } else {
      const wrap = $('<div><div class="lockbar"><span class="lk">🔒 Confirmation codes are locked</span></div><div class="lockrow"><input type="password" inputmode="text" autocomplete="off" placeholder="Family passphrase"><button>Unlock</button></div><p class="lockhint">Codes are encrypted on the page — the passphrase never leaves this device.</p></div>');
      const input = wrap.querySelector('input'), btn = wrap.querySelector('button');
      const go = async ()=>{
        wrap.querySelectorAll('.lockerr').forEach(n=>n.remove());
        try { const map = await decryptSecrets(input.value); CODES = map; PASS = input.value; try{sessionStorage.setItem('andiamo-codes', JSON.stringify(map)); sessionStorage.setItem('andiamo-pass', input.value);}catch(e){} render(); }
        catch(e){ wrap.appendChild($('<p class="lockerr">That passphrase didn’t work — try again.</p>')); }
      };
      btn.addEventListener('click', go);
      input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') go(); });
      host.appendChild(wrap);
    }
  }

  // ---- TRIP (info) ----
  function viewTrip(host){
    host.appendChild($('<p class="eyebrow">Good to know</p>'));
    host.appendChild($('<h1 class="title">Trip</h1>'));
    host.appendChild($('<p class="sub">'+esc(TRIP.name)+' · '+esc(TRIP.subtitle)+'</p>'));

    if (window.SECRETS){
      host.appendChild($('<hr class="rule">'));
      host.appendChild($('<p class="sect-label">Confirmation codes</p>'));
      renderLock(host);
    }

    TRIP.legs.forEach(l=>{
      const q = encodeURIComponent(l.hotelAddress);
      host.appendChild($('<div class="card"><h3>'+esc(l.city)+' · '+MO[asDate(l.start).getMonth()]+' '+asDate(l.start).getDate()+'–'+asDate(l.end).getDate()+'</h3><p><b>'+esc(l.hotelName)+'</b></p><p>'+esc(l.hotelAddress)+'</p><div class="actions"><a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+q+'">📍 Directions</a></div></div>'));
    });

    host.appendChild($('<div class="card"><h3>Dress code</h3><ul class="plain">'+TRIP.dress.map(d=>'<li>'+esc(d)+'</li>').join('')+'</ul></div>'));

    // open items (things without a confirmation)
    const open = [];
    TRIP.events.forEach(e=>{ if((/not yet|not added|check this/i).test(e.note||'')) open.push(fmtDate(e.date)+' — '+e.title); });
    if (open.length) host.appendChild($('<div class="card"><h3>Still to add</h3><ul class="plain">'+open.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul></div>'));
  }

  // ---- add a stop (opens a pre-filled GitHub issue you submit; an Action adds it) ----
  function addStopButton(date){
    const b = $('<button class="addbtn">＋ Add a stop</button>');
    b.addEventListener('click', ()=>{ location.hash = '#add/'+date; });
    return b;
  }
  function sendToTrip(item){
    const body = 'Add this to the itinerary (from the Andiamo app):\n\n```json\n' + JSON.stringify(item) + '\n```\n';
    const url = 'https://github.com/'+GH_REPO+'/issues/new?title=' +
      encodeURIComponent('Trip item: ' + item.title) + '&body=' + encodeURIComponent(body);
    window.open(url, '_blank');
  }
  function viewAdd(host, date){
    const back = $('<button class="backbtn">‹ Back</button>');
    back.addEventListener('click', ()=>{ location.hash = '#day/'+date; });
    host.appendChild(back);
    host.appendChild($('<p class="eyebrow" style="color:var(--lapis)">Send to trip</p>'));
    host.appendChild($('<h1 class="title">Add a stop</h1>'));
    host.appendChild($('<p class="sub">Fill this in, then submit it on GitHub (signed in as you). It shows up in the app within a minute — no password stored.</p>'));

    const dayOpts = TRIP.days.map(d=>'<option value="'+d.date+'"'+(d.date===date?' selected':'')+'>'+esc(fmtDate(d.date))+' — '+esc(d.title)+'</option>').join('');
    const typeOpts = [['sight','Sight / place'],['meal','Food / dinner'],['tour','Tour'],['ticket','Ticket'],['transit','Transit']].map(t=>'<option value="'+t[0]+'">'+t[1]+'</option>').join('');
    const form = $(
      '<div class="addform">'+
        '<label>What is it?<input id="af-title" type="text" placeholder="e.g. Gelato at Giolitti" autocomplete="off"></label>'+
        '<label>Day<select id="af-date">'+dayOpts+'</select></label>'+
        '<label>Time — leave blank for “any time”<input id="af-time" type="time"></label>'+
        '<label>Type<select id="af-type">'+typeOpts+'</select></label>'+
        '<label>Address (optional — makes the map link exact)<input id="af-addr" type="text" placeholder="street &amp; city, or leave blank" autocomplete="off"></label>'+
        '<label>Note (optional)<textarea id="af-note" rows="2" placeholder="anything to remember"></textarea></label>'+
      '</div>'
    );
    host.appendChild(form);
    const err = $('<p class="lockerr" style="display:none"></p>');
    const btn = $('<button class="act ticket" style="margin-top:16px">Send to trip →</button>');
    btn.addEventListener('click', ()=>{
      const title = form.querySelector('#af-title').value.trim();
      if (!title){ err.textContent = 'Give it a name first.'; err.style.display = 'block'; return; }
      const item = { date: form.querySelector('#af-date').value, start: form.querySelector('#af-time').value || null, title: title, type: form.querySelector('#af-type').value };
      const addr = form.querySelector('#af-addr').value.trim(); if (addr) item.address = addr;
      const note = form.querySelector('#af-note').value.trim(); if (note) item.note = note;
      sendToTrip(item);
    });
    host.appendChild(btn);
    host.appendChild(err);
    host.appendChild($('<p class="lockhint">GitHub opens in a new tab — tap “Submit new issue” there to finish.</p>'));
  }

  // ---- router ----
  const TABS = [
    { id:'today', label:'Today', icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
    { id:'days',  label:'Days',  icon:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>' },
    { id:'trip',  label:'Trip',  icon:'<path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/>' },
  ];
  function currentTab(){ const h=(location.hash||'#today').slice(1); return h.split('/')[0] || 'today'; }
  function renderTabs(){
    const bar = document.getElementById('tabbar'); bar.innerHTML='';
    const cur = currentTab();
    const active = (cur==='day' || cur==='booking' || cur==='add') ? 'days' : cur;
    TABS.forEach(t=>{
      const b = $('<button class="tab'+(active===t.id?' on':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+t.icon+'</svg>'+t.label+'</button>');
      b.addEventListener('click', ()=>{ location.hash='#'+t.id; });
      bar.appendChild(b);
    });
  }
  let pendingSlide = null, lastRenderedHash = null;
  function render(){
    const host = document.getElementById('view'); host.innerHTML='';
    const h = (location.hash||'#today').slice(1);
    if (h.startsWith('day/')) viewDayDetail(host, h.slice(4));
    else if (h.startsWith('booking/')) viewBooking(host, h.slice(8));
    else if (h.startsWith('add')) viewAdd(host, h.indexOf('/')>-1 ? h.slice(h.indexOf('/')+1) : TRIP.startDate);
    else if (h==='days') viewDays(host);
    else if (h==='trip') viewTrip(host);
    else viewToday(host);
    renderTabs();
    // play an enter animation only when the route actually changed (not on background re-renders)
    if (h !== lastRenderedHash){
      host.classList.remove('anim-fade','anim-next','anim-prev');
      void host.offsetWidth;
      host.classList.add(pendingSlide==='next' ? 'anim-next' : (pendingSlide==='prev' ? 'anim-prev' : 'anim-fade'));
      window.scrollTo(0,0);
    }
    lastRenderedHash = h; pendingSlide = null;
  }
  window.addEventListener('hashchange', render);
  render();

  // ---- swipe / arrow-key / tap navigation between days ----
  const currentDayISO = () => { const h=(location.hash||'').slice(1); return h.startsWith('day/') ? h.slice(4) : null; };
  function goDay(delta){
    const cur = currentDayISO(); if (!cur) return;
    const i = TRIP.days.findIndex(d=>d.date===cur), j = i + delta;
    if (i<0 || j<0 || j>=TRIP.days.length) return;
    pendingSlide = delta>0 ? 'next' : 'prev';
    location.hash = '#day/'+TRIP.days[j].date;
  }
  (function attachSwipe(){
    const app = document.getElementById('app');
    let x0=null, y0=null, t0=0;
    app.addEventListener('touchstart', (e)=>{ if(e.touches.length!==1){ x0=null; return; } x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); }, {passive:true});
    app.addEventListener('touchend', (e)=>{
      if (x0===null) return;
      const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0; x0=null;
      if (currentDayISO() && dt<600 && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) goDay(dx<0 ? 1 : -1);
    }, {passive:true});
    window.addEventListener('keydown', (e)=>{
      if (!currentDayISO()) return;
      if (e.key==='ArrowLeft') goDay(-1); else if (e.key==='ArrowRight') goDay(1);
    });
  })();

  // ---- refresh weather + pull any items added from a phone (custom.json) ----
  fetchWeather().then(()=>render()).catch(()=>{});
  loadRemoteCustom();

  // ---- load encrypted confirmation codes if present (safe: ciphertext only) ----
  (function(){
    const s = document.createElement('script');
    s.src = 'secrets.enc.js';
    s.onload = ()=>{ render(); };
    s.onerror = ()=>{};
    document.head.appendChild(s);
  })();

  // ---- offline support ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
